body:
  text: 慶元路天寧禪寺語録門人妙淨無我等編師於至正二十三年癸卯六月草七日入寺指山門云千人排門不如一人拔關夜暗晝明天高地厚佛殿燒香云三世諸佛不知有狸奴白牯却知有日午打三更面南看北斗祖堂西天東土𦦨續芳聯不與凡聖同纏超然名之曰祖據室拈主丈從上老骨柦向者裡揭示第一義諦如青天白日卓主丈須彌頂上浪滔天拈劄寶印當空妙重重錦縫開靈山付囑驗在今日山門疏屋裏生涯有甚難見聲和響順形直影端三宗諸山疏各乘願輪各闡宗猷嶽聳波騰龍驤虎驟指座更不作禮須彌燈王便乃高升此座舉足下足惟我自知升座拈香祝聖罷斂衣就座湖心和尚白椎云法筵龍象衆當觀第一義僧出問赤水求珠猶是人間之寶和雲唱出固非格外之機學人上來請師祝聖師云舜日高懸億萬春進云祝聖已蒙師指示宗乘端的事如何師云幡竿尖上鐵龍頭進云二六時中畢竟如何體會師云月裡仙人巧𦘕眉進云將謂少林消息絶一花重綻劫前春師云切忌亂針錐乃云摩竭法令披沙揀金少室家風守株待兔二途不涉別有條章所以道法不孤起仗境方生有時拈一莖草作丈六金身有時將丈六金身作一莖草不是神通妙用亦非法爾如然直得萬家叢裡古佛場中人人常光現前箇箇壁立萬仞堯風與慈風並扇舜日與慧日長明堪報不報之恩以助無為之化然雖如是衲僧分上猶是半提更須知有全提時節竪拂子祝融峰頂上露滴萬年松復舉保壽開堂三聖推出一僧保壽便打三聖云與麼為人非但瞎却者僧眼瞎却鎮州一城人眼去在保壽擲下主丈便歸方丈師云有者道三聖起平地風波保壽具超方眼目撿點將來鼻孔總在者僧手裏拈拄杖若無舉鼎拔山力千里烏騅不易騎湖心和尚再白椎云諦觀法王法法王法如是當晚小參僧問近離萬松深處來據雙檜要津少室宗乘請師舉唱師云十字街頭石敢當進云一言逈出青霄外四衆雲臻笑點頭師云月似彎弓少雨多風進云德山小參不答話洞山小參不點燈意旨如何師云七棒對十三進云可謂了了了時無可了玄玄玄處亦須訶師云胡人飲乳反怪良醫乃云山僧道慚先哲荏苒高年飯蔬飲水幸安林下伏承省院大人諸山知識誤採虗聲俾主城隍古寺辭不獲已祗奉命嚴乍到此山為衆小參此乃叢林古式既無玄妙可說何妨據實而論從上若佛若祖無非為一大事因緣故出現於世所謂大事因緣者乃聖凡共有之靈智也在聖不增在凡不減只為情生智隔想變體殊於三界二十五有枉受輪轉菩提心中皆為浮虗妄想凝結拈主丈如上許多葛藤拈向一邊且道西天那闌陀寺後即今有幾人修行卓主丈雲藏無縫襖鳥宿不萌枝復舉達磨大師偈云吾本來茲土傳法救迷情一花開五葉結果自然成松源老祖云羲之字畫入石三分李杜文章光𦦨萬丈師云松源老祖用黑豆法換人眼睛則不無要明達磨大師此偈猶未可在以拂子畫一畫路從平處險人向靜中忙中秋謝首座藏主都寺侍者上堂仰山夢升天宮第二座說摩訶衍法壓沙覓油鳥窠吹起布毛通侍者便乃悟去構角取乳且道倒跨三腳驢蹈翻華藏海畢竟又如何話會以拂子畫一畫人間秋半天上月圓上堂五千教典一句全該一擊金槌十方震動蝦蟇跳上梵天蚯蚓抹過東海可憐傅大士處處失樓閣開爐兼謝諸山江湖上堂世界闊一丈古鏡闊一丈火爐闊一丈賴有明宗知識具眼象龍未舉先知拈主丈三面狸奴腳蹈月兩頭水牯手拏煙上堂車馬喧闐利名捷徑紅塵浩浩酒色樊籠汝等諸人要識文殊普賢大人境界更莫外求拈主丈朝悠悠暮悠悠欲窮千里目更上一層樓冬至小參僧問時節若至其理自彰時臨亞歲節屆書雲如何是自彰底理師云閉目食蝸牛一場酸澀苦進云莫是魯公臺上書雲漢女宮中測日麼師云汝自己事合作麼生進云自是不歸歸便得五湖煙景有誰爭師云十八十九癡人夜走乃云無邊剎境自它不隔於毫端十世古今始終不離於當念無空劫已前自己無日用現行自己皓老布裩赫赤慈明揭榜堂前總向鬼窟裡作活計觀世音菩薩將錢買胡餅放下手元來却是饅頭無事晚來江上望三三兩兩釣魚舟復舉嚴陽尊者問趙州一物不將來時如何州云放下著師云趙州放下著日午打三更樓至拳頭大波斯鼻孔長上堂舉須菩提尊者巖間宴坐諸天雨花讚歎尊者云空中雨華讚歎復是何人云何讚歎天云我是梵天敬重尊者善說般若尊者云我於般若未嘗說一字天云如是尊者無說我乃無聞無說無聞是真說般若師云者箇說話大似把髻投衙抱贓叫屈撿點將來總不得無過拈主丈卓一下佛成道上堂我佛世尊棄萬乘金輪之位逾城出家拔劒斬髮雪山六載麻麥充飢夜覩明星成無上道好大衆我等沙門釋子在佛光中不得孤負先聖不得埋沒自己以拂子畫一畫三十三天撲帝鐘狸奴倒上菩提樹上堂舉傅大士云夜夜抱佛眠朝朝還共起起坐鎮相隨語默同居止纖毫不相離如形影相似欲識佛性義只者語聲是玄沙云大小傅大士只認得箇昭昭靈靈驀拈主丈卓一下雪后始知松柏操事難方見丈夫心上堂魯祖面壁禾山打鼓祕魔擎叉金牛作舞者一隊漢竊得些子鬼家活計各要大開門戶我此一衆東廓上西廊下山門頭合掌佛殿裡燒香切忌撞著露柱擊拂子下座元旦上堂僧問師子出窟時如何師云南山起雲進云出窟后如何師云北山下雨進云欲出未出時如何師云手執夜明符幾箇知天曉進云如何是新年頭佛法師云青絹扇子足風凉進云萬法歸真真歸何所師云三腳蝦蟇著錦襠乃云年新月新日新時新不見道三陽交泰萬物咸新拈主丈山僧主丈子不得不新卓主丈元宵上堂以十鏡喻十法界以一燈喻一真心老真歇說道理則不無未免旁觀者哂且道誰是旁觀者喝一喝下座上堂祖師心印狀似鐵牛之機有時拈向人前便道現成買賣今朝二月初一喜見天晴日出拍禪床下座佛涅槃上堂諸佛心內衆生流浪生死衆生心內諸佛證大涅槃涅槃生死無二無二分無別無斷故以拂子畫一畫犀因玩月文生角象被雷驚花入牙上堂舉靈雲見桃花悟道頌云三十年來尋劒客膠柱調絃幾回葉落又抽枝風恬浪靜自從一見桃花後眼似眉毛直至如今更不疑有甚用處擊拂子下座結夏小參才見元正啓旦又逢法歲斯臨衲僧家便道以大圓覺為我伽藍身心安居平等性智又道護生須是殺殺盡始安居殊不知者般殘羮餿飯喫了吐不得底如麻似粟吐了喫不得底如麻似粟拈主丈耳裡著不得水眼裏著不得沙卓主丈結夏上堂舉天平禪師因到西院居常自言莫道會佛法今時覓箇舉話人也無西院知一日逢見乃召云從舉頭院云錯行兩三步院又云錯近前院云適來兩錯是西院錯是上座錯云某甲錯院云錯錯休去院云且在者裏過夏待共上座商量者兩錯當時便行住院后謂衆云我當初行腳時被業風吹到汝州思明長老處被它連下兩錯更留過夏待共我商量我不道與麼時錯發足南方時早知道錯了也師云留僧過夏尋常事兩錯商量也大奇幾度桑田變滄海從來𦘕餅不充飢聖節上堂河洛呈瑞聖人出興萬國歌謠均陶至化八荒賓貢共樂升平林下衲僧感恩有分一聲清磐一聲佛願祝吾皇億萬春上堂舉馬祖大師因百丈南泉西堂三人玩月次大師云正與麼時如何西堂云正好供養百丈云正好修行南泉拂袖便去大師云經歸藏禪歸海惟有普願獨超物外師云叢林多以刁刀相似魚魯參差理論三大士玩月話殊不知馬大師鼻孔失却半邊上堂昨日出郭迎接御香聞得兩家說話一家云東行不知西行價爭得買賣一般一家云騎馬不若乘船爭得往來相似拈主丈生鐵昆侖舞柘枝笑倒東村王大伯上堂僧問不重己靈求解脫往來消息為誰通師云盲人喝賊虎進云一言已出駟馬難追師云靈利師僧天然有在進云旁觀者哂師云乞兒見少利進云慣從五鳳樓前過手握金鎗賀太平師云分明記取乃云華嚴會上一箇善財法華會上一箇龍女涅槃會上一箇屠兒總是立地成佛底樣子良久甜瓜徹蒂甜苦瓠連根苦此土西天十萬程冬至寒食一百五上堂舉古德偈云頻頻喚汝不歸家白璧無瑕貪向門前撒土沙枯木抽牙每到年年二三月蟻食生鐵滿城開遍牡丹花鱉咬蝦蟇擊拂子下座解夏小參盡十方世界是圓覺伽藍盡十方世界是摩醯正眼汝等諸人於九十日內竪起脊梁端坐時焚香禮佛誦經時觀樓閣市井種種物象時聞鐘鈴鑼鼓種種音聲時乃至拈匙放筯語默動靜種種施為時還見得親徹也無若也見得前無釋迦後無彌勒擲大千於方外納須彌於芥中西天蠟人氷東土鐵彈子到者裏總用不著其或未然無孔鐵槌成隊走可憐滅却少林宗復舉雲門大師因夏末問僧云夏末秋初不觸平常道將一句來僧無對自代云初三十一中九下七師云盡道雲門大師賣寶撞著瞎波斯殊不知無端道箇初三十一中九下七笑破土地口擊拂子下座上堂鬪諍為正宗懈怠為兼修古聖至言驗在今日以拂子畫一畫泥金剛既不汗流石烏龜何曾解語上堂舉禾山德普禪師講席有聲兩川以義虎稱之參方首謁黃龍便問阿難問迦葉世尊傳金襴外別傳何物迦葉云倒却門前剎竿著意旨如何龍云上人出蜀曾到玉泉不山云曾到龍云曾掛搭不山云一夕便發龍云智者道場關將軍打供與結緣幾時何妨山良久復理前問黃龍俯首山趨出豁然有省大驚曰兩川義虎不消此老一唾師云義虎重詢不自欺黃龍俯首益人疑只將日用金剛杵要碎多年鐵疾藜咄開旦過示衆叢林古式八月初一方開旦過蓋為四海禪流者邊過夏那邊經冬擇友求師決擇己躬大事今則不然也無夏也無冬要住即住要行即行忽然走入荒村古院覓飯喫撞著鼻涕垂頤老凍膿問云上人來自大方如何是上人己躬大事被它輕輕問著直得眼似鼓椎口如木𣔻返生異見增長無明所以道業識茫茫無本可據者是也者等師僧也喚作出叢林入保社異日閻羅老子索飯錢有說在我此一衆不待繁辭暑退凉生伏惟珍重中秋上堂貪觀天上月失却室中燈古德與麼說話面皮厚多少驀拈主丈卓一下有來由無本據黃梅山中墜腰石龍朔元年老盧記上堂久病方起擊鼓升堂口吻遲鈍無可舉揚新請藏主日本國裏高士侍者燒香問訊未知落處上大人丘乙己化三千七十士可知禮也擊拂子下座九日上堂今朝九月九那箇不知有一盞茱萸茶從它酒可賒五湖真衲子未舉心先死天寧與麼告報真是真實相為擊拂子有意氣時添意氣不風流處也風流上堂舉神鼎諲和尚舉南泉道我十八上便解作活計趙州道我十八上便解破家散宅神鼎云且道破家散宅底好解作活計底好初心底人且依前語若是久參宿德直須破家散宅更云萬里崖州師云有者道神鼎和尚縱奪可觀抑揚有準殊不知錯下名言天寧門下解作活計底好與二十棒破家散宅底好與二十棒不見道齊之以禮開爐上堂今朝十月初一叢林是處開爐我此城隍古寺其奈柴炭全無陳如尊者一場懡㦬走入露柱裡去山門頭金剛神合掌讚云好箇古佛家風直是超情絶謂驀拈主丈卓一下知音知后更誰知祖忌拈香逾沙越漠歷魏遊梁九年面壁皮髓分張以香扣爐云殃害叢林話轉長施主至并謝藏主都寺上堂三界二十五有因塵勞而生六波羅密度門以布施為最一大藏教具有明文拈主丈楊岐栗棘蓬切忌渾淪吞上堂四大色身不解說法聽法肝膽脾胃不解說法聽法虗空不解說法聽法惟人人分上歷歷孤明底解說法聽法古人與麼道抑下多少威光天寧則不然擊拂子下座冬至上堂舉溈山和尚示衆云仲冬嚴寒年年事運推移事若何仰山近前叉手而立溈山云誠知你答不得者話又問香嚴嚴云某甲偏答得者話溈山再問香嚴嚴亦近前叉手而立溈山云賴遇寂子不會師云有者道問既相似答亦一般因甚肯一不肯一殊不知溈仰家風父子雖親及乎話到誵訛猶隔海在天寧要斷不平拈主丈卓一下上堂僧問如何是向上關棙師云賊不打貧兒家進云青山隱白雲行人遊未到師云馬瘦毛長僧禮拜師喝一喝乃云言無展事語不投機承言者喪滯句者迷拈主丈南天台北五臺總在山僧主丈頭上卓主丈雨下階頭溼天晴又沒泥佛成道上堂六載雪山成底事長空午夜覩明星金烏玉兔升還墜換却幾多人眼睛上堂舉水潦問馬祖西來的的意被馬祖當胸蹈倒水潦忽然契悟起來撫掌呵呵大笑云也大奇也大奇百千三昧無量妙義只向一毫頭上便一時識得根源去乃作禮而退師云叢林中盡道水潦被馬祖蹈倒有箇悟處殊不知馬祖當時被水潦塗糊一上至今無地逃羞拈拄杖千年田八百主卓主丈除夜小參欲識佛性義當觀時節因緣時節若至其理自彰不見僧問古德年窮歲盡時如何古德云東村王老夜燒錢者箇說話叢林中多是隨語生解且喜沒交涉只如僧問楊岐和尚如何是佛楊岐云三腳驢子弄蹄行汝又如何商量直饒向金不博金水不洗水處道得倜儻分明也是厨中拭帛驀拈主丈卓一下塞北千人帳江南萬斛舟復說偈云五天蒿箭攪支那雪老冰枯事若何明日三陽交泰後不妨同唱太平歌元旦上堂元正肇祚鳳曆更新擊鼓升堂合談何事天得一以清地得一以寧君王得一文明至治衲僧得一鼻孔遼天拈拄杖且道拄杖子得一必竟有何奇特以拄杖畫一畫截斷鄞江水分開鄮嶺雲示衆叢林在在正蕭然末法今當一萬年活計多知藏鬼窟全威誰解按龍泉已降我虎不須坐未出睡蛇那可眠一句投機播寰宇杖林山下竹筋鞭元宵上堂一二三四五新羅與占波鬪額五四三二一燈籠與露柱交參以拂子畫一畫井底蝦蟇吞却月無言童子口喃喃上堂春山疊亂青春水漾虗碧寥寥天地間獨立望何極有者道雪竇大師因慈悲之故有落草之談天寧未免為它從頭注破春山疊亂青客來須看春水漾虗碧賊來須打寥寥天地間阿魏無真獨立望何極水銀無假擊拂子下座結夏上堂文殊三處度夏達磨九年面壁且道意在於何以拂子畫一畫於斯見得變大地作黃金攪長河為酥酪供養上座未為分外其或未然且𢬵一夏推尋看待到秋風別問津上堂毛吞巨海芥納須彌則且置千光王靜住如來在天寧拂子頭上禁足九旬今已過半且道功不浪施一句畢竟又如何舉唱良久氣似鞴袋令人可愛上堂舉古德云佛從無依生若悟無依佛亦不可得佛從無依生築著磕著若悟無依佛亦不可得三十二相八十種好向什麼處去也以拂子畫一畫青原白家三盞酒喫了猶道未沾唇上堂舉僧問白水本仁禪師如何是不遷義仁云落花隨流水明月上高峯師云大好不遷義白水盡力只道得八成有問天寧如何是不遷義只向道彩鳳舞丹霄烏龜鑽破壁解夏上堂桑田成海幾番枯昨夜西風到井梧浩浩塵中須辨主釋迦彌勒是他奴上堂舉教中道居一切時不起妄念眼裡著不得沙於諸妄心亦不息滅耳裏著不得水住妄想境不加了知蝦蟇跳上梵天於無了知不辨真實蚯蚓抹過東海拈主丈釋迦老子來也卓主丈龍門無宿客龜鶴自成仙示衆埋頭玄妙語言間掉臂幾人能過關夢境風波空險惡覺天日月本寬閒定光金地遙招手迦葉靈山獨破顏我欲從頭重勘過免教一向管窺斑重陽謝丞相施財修佛殿并謝西堂監收上堂柱石皇家金湯佛法還他大力量人田中稻熟及時收顆粒圓成免外求此是衲僧用處且道文殊是七佛之師因甚在釋迦會下聽法以拂子畫一畫三年逢一閏九日是重陽上堂舉羅漢南禪師示衆云紅霞穿碧落白鷺點滄洲不是寒山子時來古渡頭騎駿馬驟高樓萬里銀河輥玉毬別明真解脫撥火覓浮漚亦和一偈舉似大衆直下蒼龍窟踢翻鸚鵡洲波斯入閙市幾箇不回頭擊鐵鼓臥龍樓八十翁翁輥繡毬娘生雙眼活莫認海水漚擊拂子下座上堂一月普現一切水一切水月一月攝永嘉大師盡其神力只道得一半拈主丈物見主眼卓竪鳳棲不在梧桐樹退院上堂古德云住則孤鶴冷翹松頂去則片雲忽過人間天寧則不然識得自家觀自在塵塵剎剎可投閒天童禪寺語録門人文暐雲淡等編師入寺指山門云重重無盡華藏海重重無盡樓閣門不勞彈指一超直入佛殿燒香云佛身無為不墮諸數石牛闌古路一馬生三寅祖堂鐵額銅頭驢腮馬頷若謂傳佛心宗一一重須勘驗據室拈主丈摩竭法令少室真規把住則泥沙匿耀放行則炟薩舒光靠主丈拈劄百千法門一印印定大功不宰大方無外山門疏建法幢立宗旨四海象龍一家桃李諸山疏各各具大眼目各各扶樹宗乘六月黃河徹底氷江湖疏地北天南收罾罷釣龍象蹴蹈非驢所堪指座此座高廣吾不能升與麼說話謾新天童不得遂驟步登座拈香祝聖罷斂衣就座上首白椎云法筵龍象衆當觀第一義師云我宗無語句亦無一法與人放一線道有可商量莫有逈脫根塵獨超言象者麼僧問九隴屹半空雙池漾虗碧絶勝古覺場萬指同棲息欣逢為國開堂極則宗乘請師提唱師云西天胡子沒髭鬚進云與麼則皇恩佛恩一時報畢師云獅子不咬麒麟進云祇如三聖道我逢人既出出即不為人興化云我逢人即不出出即便為人意旨如何師云千聞不如一見進云可謂蒲團時倚無餘事永日寥寥謝太平師云不是弄潮人爭入洪波裡僧禮拜歸衆師乃云法隨法行法幢隨處建立有時向十字街頭拋沙撒土有時向千峰影裏嘯月披雲喚作建立法幢埋沒自己不喚作建立法幢孤負先聖衲僧家機如掣電眼似流星到者裏也須明白始得天左施地右轉日東上月西落黃河三千年一清蟠桃三千年結實且道不拘凡聖不落古今畢竟又如何話會竪拂子天高群象正海闊百川朝復成一偈舉似大衆真空妙有不相干盤走珠兮珠走盤竪亞摩醯頂門眼大千沙界掌中觀上首復白椎云諦觀法王法法王法如是當晚小參僧問承教有言止止不須說我法妙難思如何是難思底法師云一二三四五進云恁麼則昔日五千增上慢今朝大衆釋疑情師云專為流通進云急水江頭須下釣如何釣得巨鼇歸師云你祇要勘破新長老進云與麼則師子窟中無異獸象王行處絶狐蹤師云你眼似鼻孔乃云似地擎山不知山之孤峻如石含玉不知玉之無瑕達磨大師來自五天竺國便云吾本來茲土傳法救迷情一華開五葉結果自然成金不博金六祖大鑑禪師云菩提本無樹明鏡亦非臺本來無一物何處惹塵埃水不洗水自后宗風廣被天下德山棒如雨點臨濟喝似雷奔祕魔擎叉禾山打鼓俱胝竪指雪峰輥毬汾陽莫妄想趙州喚喫茶者一隊老骨查鬼面神頭千差萬別爭奈鼻孔總在新天童手裡拈主丈千年桃核裏元是舊時仁復舉前住當山啓禪師因僧問學人卓卓上來請師的的禪師云我者裏一痾便了有甚卓卓的的師云者僧好箇問端大似眼中著屑啓禪師作家手段不能腦后抽釘開爐上堂舉此菴師祖偈云開爐今歲無柴炭潦倒情懷實不安寒氣四山來得重大家收足上蒲團亦成一偈舉似大衆無柴無炭尋常事懶把家私說向人撥著冷灰重發𦦨三冬和氣藹如春祖忌拈香得得西來有何奇特一葦渡江九年面壁奴呼釋迦婢視彌勒若謂分皮分髓隻履西歸檢點將來分文不直遠諱之晨爇此枯木聊表世儀上堂舉長沙岑和尚因張拙秀才看佛名經乃問百千諸佛但聞其名未審居何國土長沙云黃鶴樓崔皓題后秀才曾題否秀才云未曾題長沙云得閒何妨題取一篇好師云張拙秀才被長沙一坐直至如今起不得天童今日為張拙秀才雪屈去也拈主丈蘇盧蘇盧靠主丈下座上堂山中往年曾有更壺或陰霾晝起密雲夜作專為報更執爨者有準以致雲堂海衆禪誦食息不失其時新禪師作記文辭奇古石刻猶存第未知更壺廢弛之餘今留何所此乃為住持者檢點家私之一端不可作佛法商量不可作世諦流布擊拂子下座上堂三條椽下七尺單前提箇話頭密密體究忽然穿透虗空亦非分外事也其或未然有寒暑兮促君壽有鬼神兮妬君福上堂毗盧藏海清淨湛然一擊金槌聖凡罔措龍吟霧起虎嘯風生八十翁翁輥繡毬草菴卸下琉璃瓦冬至小參僧問群陰剝盡一陽復生小人道消君子道長衲僧分上畢竟如何師云猛虎口中撑玉筯進云恁麼則一氣不言含有象萬靈何處謝無私師云攻乎異端斯害也矣進云學人未曉其中旨請師方便再宣揚師云榑桑人種陝西田進云便恁麼去而如何師云拔劒攪龍門進云謾某甲一人即得爭奈大衆眼何師云合取狗口乃云靈光不昧萬古徽猷智鑑洞明十虗普應時臨亞歲節屆書雲擊動法鼓大衆雲集一一天真一一明妙更待說箇什麼若說有法又被有礙若說無法又被無礙若說不有不無法又被不有不無礙若說不不有不不無法又被不不有不不無礙雲從龍風從虎聖人作而萬物覩日可冷月可熱衆魔不能壞真說以拂子畫一畫黃檗樹頭懸蜜果無言童子唱巴歌復成一偈舉似大衆塵塵自己光明藏法法何曾有去來謾道一陽生地底競觀葭管動飛灰上堂冬至月頭賣被買牛冬至月尾賣牛買被此是三家村裡田厙翁底言語雖然其驗如神不見道粗言及細語皆歸第一義若謂第一義衲僧門下正是誑嚇閭閻拈主丈三邊不用安戈甲萬里歌謠謝太平看藏經上堂今人看古教未免心中閙欲免心中閙須知看古教古德與麼說話也有權也有實也有照也有用未免有一處誵訛良久阿耨達池深四十丈闊四十丈也要諸人共知上堂僧問如何是佛師云八角磨盤空裡走進云如何是法師云赤腳蹈冰稜進云如何是僧師云井底種林禽進云如何是一體三寶師云驊騮將捕鼠不及跛猫兒僧禮謝師乃云佛祖向上巴鼻諸人本地風光得破者銀山鐵壁不破者銀山鐵壁且道一大藏教是箇切腳畢竟喚什麼作正文拈主丈興化棒頭知落處笑看千嶂起風雷臘八上堂六年修道魚投網午夜觀星鶴出籠嚇鬼謾神二千載塵毛剎海撼腥風上堂未達境惟心起種種分別達境惟心已分別則不生者箇說話老僧三十年前得受用三十年后不得受用蟭螟蟲吞却階前下馬臺則不問汝等諸人長年喫飯還曾咬著一粒沙麼擊拂子下座上堂舉僧問雲門如何是雲門一曲門云臘月二十五師云臘月二十五喚作雲門曲聞者耳須聾唱者舌須禿南地竹兮北地木六六依然三十六除夜小參僧問𪹼竹聲中殘臘盡請師直示少林宗師云潘閬倒騎驢進云心是根法是塵兩種猶如鏡上痕痕垢盡時光始現心法雙忘性即真如何是性即真師云劒去久矣汝方刻舟進云與麼則野老不知堯舜力鼕鼕打鼓祭江神師云螺螄吞大象乃云古來吾宗旺化不拘院之大小不分職之東西非特長連床上一念萬年至於開田燒畬負舂運薪之際未嘗不互相激揚貴乎發明千聖頂𩕳上不傳之妙上至王公卿士下及耕牧樵漁徹證向上巴鼻者比比有焉今則不然雖千礎萬指之剎以西來單傳直指之宗視為桎梏縱有言說罕究根源懈於夙興多缺參會禮法囿於世故不明因果愆尤我此一衆智識不凡敢望即事即理同德同心支大廈之將傾回狂瀾於既倒不踐今時近跡堪躡古聖遐蹤不見北禪賢禪師歲夜小參云年窮歲盡無可與諸人分歲且烹箇露地白牛炊黍米飯向榾柮火唱村田樂何故免見倚他門戶傍他牆剛被時人喚作郎下座歸方丈少時有倚遇上座入方丈喚云和尚門外有公人來禪云作什麼遇云道勾和尚納筋角禪遂捋下頭帽拋在地遇乃從地拾之禪便擒住云捉賊捉賊遇却將帽覆禪頂云天寒且還和尚禪呵呵大笑大小北禪雖則大開東閣未免與賊過梯遇上座無端禍出私門也是垛生招箭檢點將來總缺悟在天童今夜歲盡年窮不惜口業牽枝引蔓鼓動臍輪無非真實相為切希勉旃復成一偈舉似大衆西祖意如何年光飛箭過撥波求火少擔草棄金多妙湛非它佛塵勞即自魔莫教開却眼子過新羅歲旦上堂舊歲已去新歲復來長空雪霽大地春回垃圾堆頭真燈𦦨發荊棘叢裡智慧花開萬法雖云一理該三臺還是大家催擊拂子下座上堂空萬法於一心了衆味於一舌不見有異相衆生同成學般若眷屬拈主丈摘楊花摘楊花長慶有願不撒沙元宵上堂不栽無影樹不吹無孔笛牛角長三寸兔角長八尺且道一燈然百千燈燈燈無盡畢竟又如何限量良久唱歌須是帝鄉人上堂僧問昭昭於心目之間而相不可覩晃晃於色塵之內而理不可分既於心目之間為什麼不覩其相師云前行不到末后太過進云恁麼則雲散家家月師云令我攢眉進云學人不會師云腳下泥生乃云長觜鳥芳樹不棲摩斯迦滄溟不入龍泉與刀斧同鐵利鈍懸殊良驥與駑駘同途遲速有異以拂子畫一畫花須連夜發莫待曉風吹上堂舉僧問西堂有問有答賓主歷然無問無答時如何西堂云怕爛却去那僧問長慶有問有答賓主歷然無問無答時如何長慶云相逢盡道休官去林下何曾見一人師云西堂慣於順風揚帆長慶妙在逆風把柂總已坐斷者僧舌頭雪竇云何不與本分草料雪上加霜上堂玲瓏巖下翠鎖亭前古往今來頂笠腰包一瓶一錫好箇衲僧圖𦘕常在諸人眼睛裡還曾覷著也麼擊拂子下座上堂千種言萬般解只要教君長不昧拈主丈石頭和尚來也卓主丈上堂舉真淨和尚示衆云頭陀石被莓苔裹卓筆峰遭薜荔纏羅漢院一年度三箇行者歸宗寺裏參退喫茶師云老真淨當時平常說話後來叢林中不應作奇特商量天童寺裏新請知事宜火速造米揍足官糧不見道若要寬先解官便下座上堂飲光論劫坐禪布袋終年落魄質庫何曾典牛蟻子不食生鐵占波國人語言難辨一二三四五虗空缺處補五四三二一黃昏候日出拍禪床下座退院上堂百尺竿頭拋鐵網千峰頂上棹金船行來此日難行事了得前生未了緣了堂和尚頌古門人思謙普莊等編舉釋迦世尊初降生時一手指天一手指地周行七步目顧四方云天上天下唯吾獨尊后雲門大師云我當時若見一棒打殺與狗子喫貴圖天下太平頌曰分手指天并指地千奇百怪展家風雲門有口好挂壁剛要重論蓋代功舉世尊一日升座文殊白椎云諦觀法王法法王法如是世尊便下座法王法令廓無涯一聲椎下要定誵訛西天東土二千載引得兒孫撒土沙舉世尊臨般涅槃時告諸弟子曰若謂吾滅度非吾弟子若謂吾不滅度亦非吾弟子滅度不滅度開口沒來由雲自帝鄉去水從江漢流舉阿難問迦葉云師兄世尊傳金襴外別傳何物迦葉召阿難阿難應諾迦葉云倒却門前剎竿著金襴之外傳何物三昧由來各不知倒却門前剎竿著阿難從此釋狐疑舉維摩經云其施汝者不名福田供養汝者墮三惡道一溪流水自忙萬疊青山不老戴嵩牛臥夕陽韓幹馬嘶芳草舉菴婆提女問文殊云明知生是無生之法為甚却被生死之所流轉文殊云其力未充生死所流其力未充蛇吞鱉鼻虎咬大蟲舉僧問趙州如何是祖師西來意州云板齒生毛西來有甚意板齒不生毛喫粥洗了茅檐日又高舉臨濟大師凡見僧入門便喝當陽一喝似轟雷也是重添醉后杯今古罕逢穿耳客與誰𢹂手上高臺舉藥山儼禪師因遵布衲作殿主浴佛次藥山云汝只浴得者箇且浴不得那箇布衲云把將那箇來藥山便休去者箇那箇總成滯貨眨上眉毛早已蹉過藥山休去太顢頇今日分明重說破舉文殊所說般若經云清淨行者不入涅槃破戒比丘不入地獄一心了了元非有萬物藝藝不可齊泉領藕花歸洞口月移松影過溪西舉丹霞到一荒院遇夜取木佛燒火向院主乃呵責曰何得燒我木佛霞以主丈撥灰云燒取舍利院主云木佛何得有舍利霞云若無舍利更取兩尊燒院主嗣后眉鬚墮落丹霞行腳投荒院正是天寒地凍時木佛拈來燒火向無端院主墮眉鬚舉南陽忠國師因唐肅宗皇帝問如何是無諍三昧師曰檀越蹈毗盧頂上行帝曰寡人不會師云莫認自己清淨法身君王出語世無如拶倒南陽老古錐清淨法身云莫認也將魚目換明珠舉僧問古德年窮歲盡時如何古德云東村王老夜燒錢東村王老夜燒錢五鳳樓前舉鐵鞭笑殺太原孚上座角聲吹徹髑髏穿舉德山凡見僧入門便棒宗師一等太垂慈白棒逢人驀面揮走遍江南與江北滿身煙水孰知歸舉僧問溈山如何是百丈真山下禪床叉手立僧又問如何是和尚真山復上禪床坐清溪道士人不識上天下天鶴一隻洞門深鎖碧窗寒滴露研朱點周易舉達磨大師自梁涉魏至洛陽少林面壁而坐經九年二祖傳法觀音示跡梁王罔識折葦渡江少林面壁直指單傳太險𡾟一華五葉成狼藉舉昔有一座主常念彌陀號有小師喚云和尚主回首小師不顧如是數四主叱之小師云和尚幾年喚他即得某甲才喚便發惡幾年喚佛渾無事數度喚師還發嗔誰握龍泉繞天下當陽能報不平人舉六祖大師因風揚剎幡二僧對論一云風動一云幡動往復曾未契理六祖云不是風動不是幡動仁者心動二僧悚然非風幡動仁者心動拈得眼睛打失鼻孔祖師真是好知音多向枯樁舊處尋舉南泉和尚云心不是佛智不是道昨日種冬瓜今朝栽茄子生涯勝舊年何樂到如此舉木平道禪師因僧問如何是祖師西來意平云石羊頭子向東看臨機開口不相謾要使醍醐透頂寒有問西來祖師意石羊頭子向東看舉香林和尚因僧問如何是衲衣下事林云臘月火燒山衲衣下事臘月燒山問來語切答去機閒千里參玄士徒教賣布單舉僧問首山如何是佛法的的大意山云楚王城畔汝水東流首山和盤托出者僧喚不回頭日日楚王城畔滔滔汝水東流舉盤山一日出門見舁喪歌即振鈴云紅輪決定沈西去未委靈魂往那方幕下孝子哭云哀哀山忽有省歌郎聲未絶孝子哭哀哀大小盤山老無端落賺來舉紫湖門下立一牌牌上書云紫湖有一狗上取人頭中取人心下取人腳擬議即喪身失命新到相看便喝云看狗才回首湖便歸方丈有問如何是紫湖狗云嘷嘷紫湖喝僧看狗是誰親遭一口茫茫走遍西天得得藏身北斗舉僧問智門蓮花未出水時如何門云蓮花出水后如何門云荷葉蓮花與荷葉自古到如今出水未出水何勞著意尋舉僧問古塔主如何是佛主云莫莫又問如何是祖師西來意主云莫莫莫莫祥麟只有一隻角黃頭碧眼笑欣欣八臂那吒空發惡舉僧問巖頭浩浩塵中如何辨主頭云銅沙鑼裡滿盛油眼中著屑腦後抽釘金不博金水不洗水挽之不後推不前獼猴上樹尾連顛舉鄂州無等禪師謁王常侍辭退才出門王乃召云和尚師回首王遂敲露柱三下師以手作圓相撥三撥便行嚇鬼謾神橫該竪抹露柱三敲圓相三撥拈起死蛇解弄也活咄咄咄舉五臺祕魔巖和尚常持一木杈凡見僧來遂提起杈云什麼魔魅教汝出家什麼魔魅教汝行腳道得也杈下死道不得也杈下死速道速道祕魔巖下老魔精立箇門庭鐵膽驚好似霍山親到後至今四海樂升平舉黃檗因南泉問黃金為城白銀為壁此是甚人居止處檗云聖人居處泉云有一人居何國土檗近前叉手泉云道不得何不請王老師道檗云有一人居何國土泉云可惜許可惜許可惜許知音不在頻頻舉當年黃檗與南泉全身輥在草窠裡舉曹山因僧問世界恁麼熱向甚處回避曹山云鑊湯爐炭裡回避僧云鑊湯爐炭裏如何回避曹山云衆苦不相到世界恁麼熱誰云回避難鑊湯爐炭裏著得老曹山舉僧問趙州承聞和尚親見南泉是否州云鎮州出大蘆蔔頭南泉何曾親見好手還它趙州拈出鎮州蘆蔔塞斷衲僧咽喉舉盤山垂語云三界無法何處求心三界本空一心何有水上捺葫蘆空中翻石臼鐵牛不怕獅子吼舉僧問趙州萬法歸一一歸何處州云我在青州作一領布衫重七斤萬法歸一一何歸誰將圓木逗方孔趙州曾在青州時作領布衫七斤重舉馬大師不安院主問和尚近日尊位如何大師云日面佛月面佛院主問來元自易大師答去亦非難無絃一曲天然別地北天南誰解彈舉僧問雲門如何是法身門云六不收雲門六不收土宿倒騎牛踢翻四大海直上五雲樓舉僧問趙州如何是趙州州云東門西門南門北門烏飛并兔走清曉復黃昏趙州如來識東西南北門舉俱胝和尚凡有所問只竪一指竪一指老俱胝電光匪急石火猶遲從來佛法無多子只許狸奴白牯知舉僧問香林如何是祖師西來意林云坐久成勞衲僧門下不在忉忉西來祖意坐久成勞舉僧問百丈如何是奇特事丈云獨坐大雄山僧禮拜丈便打有問如何奇特事便云獨坐大雄山待它禮拜劈脊打也似波斯念八還了堂和尚讚語門人宗遠思廉等編無量壽佛稽首樂大導師曠劫乘茲大願輪猶如杲日升虗空群生蒙益無窮已演暢微妙最上乘舌相遍覆三千界羣生迷妄久逃逝廣開攝受方便門一志誠心二深心三者回向發願心塵勞業謝閻浮提九品咸生安養土七重樹聳諸般樂重重珠網光交羅四色華敷八德池池中香水恆充滿白鶴孔鸚鵡等異口同出和雅音物我互融宣法化實非罪報之所生導師功德難思議我說持尺量虗空樂殊勝難思議我說持蠡測巨海徹見本性自彌陀諦了惟心自淨土十方剎海悉鎖殞十方如來同證明維摩居士我觀古聖出興無非不思議力居士示疾毗耶尤非世智能測借寶座於燈王請飯於香積如置棗葉針鋒斷取妙喜佛國彈偏擊小兮眼觀東南歎大褒圓兮意在西北願展纖毫神通頓釋群生蒙惑既云文字性空何對文殊一默普賢大士稽首普賢大士大行大願度生無邊法界微塵一一塵中遍入塵中所有寶剎剎剎咸有大士手執妙蓮經卷端坐雪色象王羣生一念相應大士即見其前群生業海未空大士行願無盡十方虗空為口百億須彌為舌讚揚大士功德功德云何讚揚觀音大士三界群有自昧己靈見不超色聽不出聲大士示見非一方便宴坐觀空空何所見十方擊鼓聞無不圓縛脫無二根塵同源真慈非慈真說無說萬國行春千江印月十四無畏剎剎全彰四無量心塵塵普應衆生界上幾曾迷剛道圓通耳根證虗空可量鐵壁可入大士示見言思莫及或定或慧或慈或威不違本誓普應羣機手裡輪珠腳下蓮天邊明月水中天度生悲願自無盡那箇衆生覺未圓全身是此經有口道不得大啓圓通門端坐盤陀石大士經文不即不離空覺極圓匪同匪異一毫端上示圓通午夜金烏海底紅玉貌雲鬟貌不如閻浮界上示真慈紅塵浩浩人如海籃裡金鱗賣與誰布袋和尚蔣公無事趂憨僧背上何曾有眼睛盡謂長汀出彌勒至今流水洗難清撫人背覓一文錢走街頭擔條主丈龍華會上補處尊弄出許多窮伎倆不在威音前不落迦文後打開破布囊囊裡般般有鼻孔分明失半邊噴嚏也成師子吼金陵真覺大士弊衣徒跣髮垂肩誰謂僧繇𦘕不全別有示人奇怪處剪刀鏡尺杖頭懸戒香啞女長廊生帚掃塵埃曠劫深乘悲願來滯句承言滿寰宇故將啞口向人開描金渡水羅漢毗盧藏海湛然恆寂一念瞥興升沈罔極有聖師四果極位應供十方親承佛記少展神通涉海騰空煙笻雨笠風虎雲龍誰把黃金幻描異相載禮載瞻捫空追響自達磨大師至歸源老人凡二十八代天台比丘嗣曇藏主命工各繪真像請讚初祖達磨大師西天毒種東土妖孽直指單傳千差萬別對梁王道箇不識𦘕虎成貍逢宋雲手𢹂隻履證龜成鱉大千沙界絶行蹤高圓熊耳峰頭月二祖可大師望真丹有大乘器立雪齊腰斷臂人了了常知言莫及華開鐵樹不干春三祖粲大師覓罪不可得與汝懺罪竟匿跡皖公山無私大圓鏡四祖信大師是誰縛汝來求解脫腦後抽釘死中得活我今無心諸佛豈有掇轉南辰移來北斗五祖忍大師問法未由栽松無暇七歲歸來翻成話傳承祖父舊家私剛向人前索高價六祖能大師倩人書壁半夜傳衣從頭怪異遍界光輝南嶽讓和尚修證則不無汙染則不得磨磚作鏡時平地生荊棘馬祖一禪師即心即佛非佛非心袖頭取領腋下剜襟剛被龐翁閒指注妙彈一等無絃琴百丈海禪師野鴨飛過去驀鼻拽教回伯牙與子期不是閒相識明朝馬祖升堂無端卷却拜席黃蘗運禪師捧却一副盂坐在南泉位上有問幾時行道便云威音已前硬如生鐵軟如綿遇著知音笑揭天臨濟玄禪師黃蘗堂前曾喫攧高安灘上始翻身分明一箇白拈賊大樹陰涼天下人興化獎禪師平欺旻德痛打克賓鉤頭有餌眼裡無筋南院顒禪師特來禮拜和尚恰遇寶應不在倦鶴投林獰龍戲海風穴沼禪師空山古寺單丁七年乞村落以活命對萬象而談禪祖祖相傳正法眼免教滅在瞎驢邊首山念禪師迦葉不聞聞世尊無說說者箇閒公案何勞強分別幾多明眼人一片紅爐雪獨許念法華笑它老風穴汾陽昭禪師逆行順行天莫測父母亡靈祭一回座下六人成大器胡僧請法不虗來慈明圓禪師遠道阻重兵易衣類廁養大法既悟明高名滿穹壤泉大道極口稱揚楊大年傾誠推獎咄楊歧會禪師電激飈馳言外旨天荒地老憑誰舉三腳驢子弄蹄行脫口氷霜滿寰宇白雲端禪師撥草瞻風尋玄覓妙撞著聱頭大發一笑窺覷無門思量莫到直饒脫體承當也是望空啓告東山演禪師雞冠華鐵餕餡多處添少處減葉落知秋開口見膽圓悟勤禪師金山熱病方蘇醒五祖回歸正此時侍者參得禪了也憐兒不覺報人知虎丘隆禪師摩醯眼活妙琢無痕般若願深大功不宰落落叢林話轉新耽耽睡虎全威在應菴華禪師虎丘室中得法洋嶼菴中付衣俯視禪流雲趨水赴高提祖令雷厲風飛密庵傑禪師問正法眼答破沙盆欺淩佛祖震動乾坤松源嶽禪師提金剛劒破邪師見網用黑豆法換衲僧眼睛楊岐之衣把住少林之旨愈明天目禮禪師大疑四衆三督黃牙量涵巨海機嶮懸崖拈出南山筀笋東海烏鰂愛向叢林驗作家橫川珙禪師磨稜就圓示成功於衲子去華取實任大法於己躬掃空當時弊習復上古醇風萬象森羅齊拭目鄮峰高出大江東竺源道禪師乾屎橛悟在一朝爛蒲鞋話行四海一具鐵面皮到死也不改豐干禪師騎虎出松門為人機用別閭丘太守前天機都漏泄都漏泄金剛腦後三斤鐵寒山拾得二大士掣風與掣顛非凡亦非聖揚下菜查筒放來苕帚柄答豐干不游五臺嚇溈山同出松徑寫盡天下心長吟并短詠倒握鐵蒺䔧擊碎軒轅鏡拍肩大笑太無端森羅萬象齊歡慶靈巖了庵和尚其嗣法弟子梨洲興長老參侍山行像半杯醇酎分獺膽九曲神珠穿蟻絲晴日侍游松下路誰云父子不傳持先師歸源和尚古鄮峰前曾失腳無端蹈著死蛇頭兒孫不是揚家醜毒氣傷人卒未休仗錫默堂和尚小師安長老請目光電掣氣宇淵澄衆衲風靡群魔膽驚大七峯如五嶽漲西江於東溟非智能測何真可呈因思普化翻筋斗何獨盤山有寧馨天童元明和尚乃翁雙溪大父歸源冰枯雪老𦦨續芳聯鞔峯室中訶佛罵祖道臻衆妙太白峯頂羅龍打鳳機透重玄起宗綱於委地動宸衷於九天三關不用立直透威音前自讚泰嶽端長老請從上傳持曾無別旨虎嘯風生龍吟霧起彈指圓成八萬門擡眸早已三千里回峯遠長老請四處住山三十載惟思佛祖報深恩曉來照影清池上頭髮莖莖白到根染山主請無傳之傳此菴家風無授之授歸源宗旨不是嫡骨孫亦非克家子指出羚羊掛角蹤要看平地波濤起多福淨長老請千峰頂上十字街頭半聾半啞全放全收破沙盆鏗金戞玉乾屎橛塞壑填溝大恩未報雙𩯭先秋妙筆最難描貌處愛同衲子結冤讎小師集福思靜長老請四處住山百醜千拙石上栽花水中捉月描貌將來家風迥別別別師子教兒迷子訣小師思謙藏主請佛祖是讎敵群魔為弟昆金圈胡亂擲栗棘渾淪吞死蛇拈起弄得活方是歸源真子孫中首座請祖翁恩大似難酬歷盡風霜白盡頭歲晏江空無著處獨騎駿馬驟高樓莊藏主請摵碎破沙盆掃除黑豆法全無巴鼻傳持惟有空拳惡辣摘楊花摘楊花阿剌剌阿剌剌我侍者請心直語拙齒踈髮皤罷遊江海投老煙蘿百丈再參馬祖一喝晴空霹𮦷國師三喚侍者三應平地風波話落叢林已久師僧錯會尤多莫把生綃描貌我擡眸子過新羅暐藏主請療餧何須炮鳳髓續絃自合取龍筋黃梅衣付負舂客妙解徒聞七百人
