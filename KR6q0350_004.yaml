body:
  text: 門人編重刊法華經印施珠山志長老請題覺皇誓願丘山重大事因緣信者稀現瑞放光嚴萬德開權顯實被群機毗盧正印當空妙般若真燈遍界輝一會靈山儼然在閻浮日月過如飛讚觀音大士心聞洞十方大哉觀自在為度苦衆生恆深悲願海我述讚詞不自量徒繪虗空絶五彩六根互用萬行齊修吹香風於旃檀林裏灑甘露於楊柳枝頭無生不度無剎不遊圓相文殊大士悟上人禮五臺後請大智七佛師塵剎咸歸命不現妙色身示此大圓鏡直饒凡聖本來同也是幻藥醫幻病布袋和尚背負布囊肩橫藤杖閒時討忙痛處抓癢落魄長年走市𢌅拋却上方兜率天豐干禪師騎虎出松門為人機用別閭丘太守前家風都漏泄都漏泄金剛腦後三斤鐵寒山拾得二大士掣風與掣顛非凡亦非聖揚下菜查筒放來苕帚柄答豐干不遊五臺嚇溈山同出松徑寫盡天下心長吟并短詠倒握鐵蒺䔧擊碎軒轅鏡拍肩大笑太無端森羅萬像齊歡慶靈照女悲願度生無盡時逆施倒用討便宜滿船家計沈湘水却向街頭賣簏籬朝陽穿破衲空山寒日當簷喜有竹針麻線此時不下工夫驢年會成一片對月了殘經天邊桂月娟娟爐上檀煙梟梟曠劫曾看底經未展卷時都了跋妙喜老祖與監務大夫手帖幻住乃大夫門館亦老祖故人也見帖中妙喜百世師機鋒萬夫敵如日行閻浮群有咸蒙益惠書監務君意真語尤直大海揚風帆高山落圓石幻住深道交臥病詢端的遠寄鎮心丹備陳調服食堂堂大乘人寧忘悲願力或示易中難或施順中逆上賢猶罔知淺智那能識持尺量虗空我謂徒疲劇石窗和尚語録寶都管重刊印施求語曹洞家風尚綿密末學那窺萬中一夜明簾外擊金鐘瑚枝頭升杲日石窗端可先宗真俗二諦尤圓融荷衆處己潔氷雪升堂開室揮天龍四會有録行世久舊板無踪歸蠧朽永嘉上人捐己資重刊印施世希有勝侶著眼觀非觀玄言妙語何相干咬人還他師子子澄潭不許蒼龍蟠化緣造石塔奉藏拭經舍利獎藏主求如來藏裏摩尼寶勝義空中設利羅香吐煙雲凝翠蓋光流星斗燦銀河金陵應禱康僧會玉几專誠劉薩何高壘雲根成窣堵廣資福聚到檀那閲藏經化糧供衆古佛應身揚化地長庚橫曉在東南重延雲侶三千指旋展霞縧五百函意在鈎頭緣般若春生筆底綻優曇要教滿鉢盛香飯當聽維摩不二談雪竇華國和尚九峯芳長老請松源遠孫枝分派列竺西嫡嗣焰續芳聯妙用全彰輥繡毬於萬家叢裏真機罔測垂金鈎於千丈巖前證先宗即心是佛憐末學待悟為禪夫是之謂華國和尚乘夙願輪饒益乎人天者也天童平石和尚東山言長老請氷雪其懷風雷其舌道被人天令行吳越起祖父欲墜之宗掃魔外架空之說竹篦三尺長用處尤親切松濤飽聽樂高年一甌清茗三更月無際和尚東甌勝絶間出名師祥麟遁跡瑞鳳來儀探驪頷抉驪珠精窮奧旨入虎穴撩虎尾弗畏雄威濟中川之舟楫匡大法之綱維此是無際和尚丹青描貌不得底真相非相之希奇者也題仲謀和尚語録後虎丘曾祖法道六傳而至鄮峰此菴師祖其嶮峻之機純全之旨咸稱復古而增輝焉此菴之傳得鳳臺佛性叔父東禪圓明先師又能大其家世佛性之傳得仙巖仲謀靈巖了菴猶景星鳳凰世不多見今觀仲謀三會說法語飈馳電激玉應金舂蓋其化去後門人結集鋟梓流通庶乎覽者咸領旨於言前譬若塗毒之鼓一撾聞者皆喪悼楚石和尚抉得龍淵珠九曲當陽能把蟻絲穿京城別衆搖金鐸法海憑誰駕鐵船傑閣那容留𭬥李浮圖永喜鎮秦川超生越死光明藏舌卷風雷舉不全悼無夢和尚宗教東南冷似灰扶持全藉出群材萬言書動龍顏悅列祖傳驚魔膽摧熊耳老胡歸竺國鴈門大士赴蓮臺本來無地容生滅要使人天正眼開悼大千和尚茫茫苦海法舟傾不復垂慈利有情祖室真燈輝太白師門的派出雙清盤陀石上名先重妙喜泉頭話太行無位真人赤骨律分明日午打三更無位真人赤骨律辭世頌語育王大千和尚火化後四物不壞其徒弟妥侍者請語謁無相居士宋公求塔銘玉几夢菴醒大夢了知幻有即真空輪珠不壞闍維日設利收來般善功擇法眼睛終爍電談玄牙齒尚關風求文刻石垂千古洞徹吾宗無相翁歸源老人示衆析成四首問佛與問法石頭路尤滑生柴帶葉燒苦瓠和根拔馳求轉更狂須信不尋常彈指超三際舒光洞十方語言并動用謾覓虗空縫三冬寒氣濃黃河連底凍只缺自承當猶多錯較量挨身入閙市紅日上扶桑禪人寫師真請讚深憐末學遐仰先宗面赤不如語直耳聾爭似心空倒握竹篦三尺鐵金烏飛上海門東心宗不可傳開口成話墮壓沙謾覓油敲氷難取火五色天麒麟掣斷黃金鎖次韻澄散聖山居真蹟樂道自然忘世緣崖根結屋屢更年霜華燦爛蒙雙𩯭雲葉參差擁半肩百丈再能參馬祖趙州早已見南泉誰來同撥地爐火話到威音大劫前奉答無相大學士宋公見寄本無自性金剛寶那有他家藥汞銀貴樂升平佐明主詞鋒筆陳肅天人善言言所不能言一句當陽明正偏珍重金華傅大士掃空疊妙與重玄答赴詔京城諸高僧見寄韻二首官驛涼生八月初承恩入對御庭除河清海晏開天統虎踞龍蟠壯帝居報國已酬千里志匡宗應上萬言書特裁雲錦遙相寄慰我林泉齒髮踈奉詔新編佛樂成萬靈趨會彩雲輕經翻貝葉開龍藏燈燦金蓮滿禁城杭海梯山懷德厚歸牛休馬賀時清當年大覺辭仁廟宸翰鐫珉在四明淨慈壽首座日本人持危宋二學士所作南堂和尚行道記語録序見示書此以贈仰山說法兜率天扶桑人種陝西田舌頭不覺添三寸鼻孔無端失半邊道人氣岸真奇絶腳踏金船載明月慈雲堂前喫蒺䔧滿懷冤屈憑誰雪京城特謁老維摩雄詞妙辨翻銀河持來長庚試一展光𦦨萬丈輝松蘿事理全彰容物我纖塵不立難肯可優鉢華敷劫外春祥麟掣斷黃金鎖次了菴和尚韻題臥雲軒深谷搆層軒紛華不到眼一榻臥白雲長年遂踈散聖賢出沒如浮雲須彌百億皆幻塵香雲樓閣遍塵剎彌勒一一能分身坐即臥兮臥即坐誰管光陰蟻旋磨勞生界上機巧萬端臥雲軒中不消一唾光明室為天淵和尚題我此光明室廣博容大千方便開戶牖悲願堅墻垣毗耶離城真規未泯摩竭提國勝軌儼然交羅從誇寶絲網四色謾說金池蓮馨香味觸常三昧經行坐臥空諸緣次天界季潭和尚韻送韞中宣首座萬八千丈華頂峯祥光貫日如晴虹間生如識到全室不離幻有談真空匡衆龍河吉祥處廣揚佛祖同風句韞中傳誦無少差妙乎不動中間樹逆施倒用侶難識量外機先好尋覓一毫端上洞根源日用現行明歷歷君不見古有永嘉真覺師曹磎證道誠希奇又不見雲峰曾參翠巖老意在驚蛇先打草不是佛兮不是心亦非禪也亦非道坐來如靠須彌山折筯謾攪滄溟乾從空放下從空看轉地軸兮回天關追和古德雜言同韻五首釋尊示跡度娑婆正法難留像法過易樹慢幢大力鬼甘縈疑網小根魔頂門眼活觀何遠肘後符靈驗自多萬一身心堅鐵石終成砥柱障頽波一千七百間公桉何處誵訛透不過脫體承當魔即佛從頭執著佛成魔心存厚德推恩廣藥奏全功識病多莫使毗盧清淨海無風匝匝湧金波老屋深雲養宿痾黃連石蜜幾嘗過罷拈藤杖勘禪侶閒把茶甌敵睡魔一剎那間猶是久盡恆沙數未為多翠岩一見慈明後便有滔天逆水波鐵杵宜將石上磨要教明試一翻過證非證也三乘果空可空兮五陰魔撥火覓漚愚不少檐泉帶月智何多宗綱力振諸知識骨冷雲山窣堵波塵沙剎海事如何六十小劫風雨過焰續智燈追列祖鋒藏慧劒怖群魔機先與奪真觀妙格外提持錯會多眨上眉毛回首看分明全水即全波心上人求舍利禮寶陀玉几峯前求舍利寶陀巖畔禮觀音要教瑞相時時現空却塵勞種種心次韻送域侍者就柬乃師仲齡和尚佛祖向上關過在強描貌有路不吾行無繩還自縛擊竹老香嚴曾謂無錐卓覓油謾壓沙取乳期搆角國師喚侍者直截何差錯望空穿鑿多平地風波惡道交仲齡翁每思觀盛作真乘好舉揚叢林正衰落嚴師禮覲復南詢彈指聲中入樓閣次木菴和尚韻示鑑維那心外非佛佛外非心無邊界不間毫髮曠大劫何分古今翠岩用處誵訛將蝦釣鱉雲峰悟時端的握土成金楮小自難懷大綆修終堪汲深師子翻身兮威獰罔測羚羊掛角兮踪跡何尋雖云悟解隨類當知演說一音行待搖鞭匪良馬棲能擇木真靈禽用恕中和尚韻送寄侍者參方千差萬別消歸己咳唾揚眉契真理道人欲作諸方遊一步當知始於此密意明明在汝邊塵勞妄覺空鏖煎烏藤倒握遍探討抉珠須造驪龍淵偷心未死成痼疾神醫拱手何由痊望真丹有大乘器老胡得得來西乾布毛吹起無別旨侍者悟去良有以竿頭百尺解翻身越聖超凡都在汝虗室歌為莊藏主賦虗也何室室也何虗虗兮匪曠室兮匪拘鑑世間如影響了聖道如蘧廬直下忘能忘所自然無缺無餘與麼與麼塵毛剎土隨緣遊戲不與麼不與麼蝸牛殼裏妄自安居當臺明鏡歷掌神珠頓空摩竭法令掃蕩毗耶真規赤腳波斯尋戶入無言童子笑軒渠樵菴斧在腰兮柴在肩三間茅屋斷橋邊盧能養母終傳法王質觀棋已得仙煨芋日高開宿火煮茶月下取寒泉當年懶盞缺周密惹動泥書下九天雪崖隆冬瑞雪豐年兆先積高崖也自奇雲盡半空騰素𦦨風生四野奮寒威神光獨立齊腰處會祖忘眠縮項時平地不無千仞險足心酸澀洞靈知答前保福仲邠和尚虗空不掛一絲頭滄海能浮萬斛舟廣學多聞都掃却橫拈倒用有來由松華堂上揮談麈玉几峯前下釣鈎雲侶憧憧問禪病機先好舉過窗牛送舜西堂省親天台南望青海邊白髮慈母延高年古寺編蒲作後範隔江舉火超先賢滔天恩波自枯竭歷劫愛網空縈纏洞明真智全真孝銀山鐵壁堅非堅示離相儔長老夾山早住一院未得親承作家不知千里懸隔謬在毫𨤲有差僧問法身便答法身無相僧問法眼便答法眼無瑕道吾為客聽法一笑略露爪牙茶邊殷勤致問未免撒土拋沙夾山器量本奇偉即住華亭見船子兩篙打時已點頭一橈呈處心全死陳年爛葛藤何用重新舉既以披衣握麈要稱祖師門下士當知吾宗顯赫利益人天有如此示師孫法雷藏主瑞光圓照升高堂鼓輒墮地聲愈揚有僧指鼓謂衆曰法雷震地何其祥弘荷大法果莫及嚮風緇白如雲集天子賜坐御榻前茶甌三蕩仍長吸汝師訓汝名法雷有意遠期成大材四海叢林正衰落波流風靡追難回汝丁壯年宜奮勵毗盧藏海空三際一句無私廓頂門歸源五葉真苗裔送邁藏主心不是佛智不是道丹霞騎聖僧馬祖踏水潦五千教典盡掀翻百億須彌俱靠倒後非遲也先非早啐之機難恰好木雞啼處月黃昏芻犬吠時天大曉絶承當離膠擾明知不覆藏却許自探討吳楚叢林知識多臨機無吝攄懷抱定山大定如山不傾動山非大定還消磨惟聞虗空不爛壞七金五嶽徒嵳峩鷲嶺衣付大迦葉龍華待傳阿逸多大洋海底遭火熱須彌頂上翻金波道人妙齡聽吾語閻浮烏兔如飛梭定起空山口無舌何能與子歌長歌信中信是道原功德母善根長養在其中玄微已向言前薦端的何妨格外通誠實功夫能保惜偏邪情解自消融還他親到不疑地空有雙忘顯正宗樵隱旋作生柴帶葉燒白雲丹嶂樂陶陶九天曾遣蒲輪召不出頭來儘自高野牛長林豐草臥雲煙鼻孔遼天不受穿消得乾坤間歲月荒來祖父舊田園韞中上人字韞中此義難部㭊不是珠沉淵亦非玉藏石自家一寶祕形山古今無價堪酬直明明不離日月間向外馳求徒費力梓巖吾聞梓是木中王托根層巖愈堅久繁柯上徹碧雲高重陰下覆蒼苔厚秋老風傳錦瑟鳴夜闌電掣金蛇走空生宴坐天雨華無說無聞獅子吼無言維摩牀上示疾善現巖間坐禪一句何曾脫口舌覆三千大千自明非從他得本有靈光不離當念洞徹十方清白軒為天寧原上人題玉壺貯水銀碗盛雪物理自彰清白誰說四時遷謝兮有古有今六窗虗明兮無二無別經行既從容宴坐尤超絶門外黃塵沒馬深毫端辨的方親切送秀書記遊台鴈掃空積翠三關語便有經天緯地謀五百聲聞都勘過詎那爭敢不低頭次韻贈興藏主佛祖最上乘非空亦非色參之詎可參得也竟何得不有寸心丹難逢雙眼碧道人精進幢終當造玄極送日本生禪人禮寶陀遊天台生緣辭絶域參禮到中洲妙相從心現真乘匪力求白華嚴洞曉紅葉石橋秋直下明端的艱勤志可酬妙禪人求何用談玄并說妙亦無密授與親傳渾侖一箇鐵餕餡細嚼方知百味全借韻勉陟藏主真誠衲子陟藏主來伴閒居三兩年處己肯摸今日樣探玄期拍古人肩良駒豈待搖鞭影瑞鳳終知飲醴泉佛祖話頭千七百直須一一薦言前借韻示暐藏主牧來水牯得純時何用施呈嚙鏃機藏裏無珍應失色籬根瓦礫自生輝本無凡聖成階級那有乾坤受範圍黃蘗當年打臨濟烏藤六十不知歸借韻示朗長老列祖大開方便門迅機殺活棒頭分長鯨吸盡百川水健鶻衝開萬里雲佛自佛兮居佛位魔誰魔也墮魔群莫嫌老我無傳授才涉纖塵染污君示徒弟楚長老古有至人善施法令似空噇空如鏡照鏡赴齊大士提起門槌掃地寒山放下帚柄百千劫未始拋離二六時自然相應修也何修證亦非證無言童子念摩訶耳根塞却分明聽借韻示徒弟思隱大陽傳法付皮履曹洞宗風墜還起滄溟枯竭須彌低千聖之手堪同擕頂門正眼如未明黃金無色蘭無馨楊岐垂派到崑阜看他各展扶宗手折膠墮指猶未寒扶珠驪頷方為難祖域荒涼正此時危如九鼎懸一絲汝能遠來慰空寂打汝罵汝都無力一句分明向汝談前三三與後三三乾峯乾長老字象初指乾曰象初乾也從何起未聞太虗空形其有終始古德曾有言貴在明自己有物天地先無頭亦無尾不逐四時凋認著還不是道人曾主乾峯來未開口前早已明斯旨咄珽藏主字大圭試玉要須經烈焰才形纖翳成玼玷不分真僞開眼人非惟燕石藏來賺難逢至寶出人間能別至寶尤為難卞和三獻遭刖足煙雲結恨遺荊山當知至寶得非得倘分美惡成仇敵明明不離萬像中鶻眼龍睛曾莫識無我字照上人求火寄諸緣或炎或熄水流於下隨曲隨直風動搖而成聲雲去來而絶跡乳和水而易分膠隱色而難識諸法何紛紜當體本空寂自家拶倒須彌盧一句了然超百億贈靈隱迅藏主堂堂古德凜凜真規美流萬世清振一時秉起金剛慧劒撒出海藏摩尼不有龍睛鶻眼難窺電激颷馳與麼與麼得之於心剖石逢玉不與麼不與麼失之於旨𦘕虎成狸莫辜三事衲惜取兩莖眉閻浮光陰迅疾不少駐究明己躬大事毋自欺次韻贈淨慈達藏主虎丘直下到西丘派列枝分多勝流萬指雲堂曾弗顧孤村草店肯遲惡機先中的同非別句裏藏鋒各有由信手揭翻華藏海還他全放復全收贈四明廉長老佛祖門庭海樣深出家自合遍參尋研窮至理楔出楔透脫玄關金博金垂棘連城難著價陽春白雪罕知音德山一見龍潭後頓息從前種種心次韻示奧侍者有見非真見無傳即正傳頭頭開智眼法法離情緣未解抽金鏃休云打鐵船布毛吹起處不是祖師禪虎丘繼藏主嘗到太白山中請舉話因寄偈見謝故答以示之開口無非觸祖翁難教金翅不吞龍陳年餕餡咬得破揚向籬根糞壤中贈輔侍者少室真規摩竭法令照乘神珠當臺明鏡言思莫及處拄杖生根心手相忘時鉢盂安柄國師三喚侍者侍者隨聲三應不是量外施功亦非機先取證南海波斯念八還生鐵崑侖側耳聽贈觀上人靈踪聖跡滿區寰東南四處尤殊特設利靈光或可求觀音妙智終難測石橋瀹茗供聲聞南冥焚檀禮彌勒喜公操心絶比倫顧我有口那緘默歇去向外妄馳求成來自己真功德咄隱翠軒為劉振道題隱翠於空兮翠豈非空隱空於翠兮空亦是色隱顯無二兮殊愧蒼穹空色不分兮那臻玄極闌干獨倚時萬像明歷歷題倒騎牛三五兒童髽兩角笛中吹得落梅華牧來水牯路頭熟顛倒騎時也到家示左右同韻二首細嚼東山鐵餕餡蔗漿氷碗讓甘涼北齊荷法思龍樹投子傳宗嗣大陽殑伽非鼻可聞香壁月無風亦自涼空手教人放下著趙州特地啓嚴陽宗淨頭求東司不可說佛法趙州此話播叢林屎腸抖擻不出底休向威音那畔尋亨淨頭求水槽每日積來滿湯鑊及時燒得溫炙地薰天乾屎橛娘生鼻孔幾曾開示道者智實參方梵語頭陀此云抖擻清淨本然塵垢何有大千界不妨山高海深無量劫一任烏飛兔走奉衆勤勞宜力行律己規繩要堅守未能追攀入室之象龍莫負捨送出家之父母不見老飲光常居萬人後知識門庭好遍參王麈橫揮獅子吼得淨人火聽誦金剛經豁開死眼解下墜腰石半夜傳衣撥波求得火燒却五須彌
