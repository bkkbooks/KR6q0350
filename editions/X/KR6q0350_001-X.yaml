王官苦拘束佛法不流行拈主丈且道鳧脛自短鶴脛自長又作麼生卓主丈三家村裡神樹子十字街頭石敢當上堂山花開似錦㵎水湛如藍物物全真智何勞更指南前三三后三三可憐昔日毗耶老只許文殊是對談雙林首座至上堂傅大士同七佛行道於雲黃山頂仰山夢第二座說法於兜率天宮二由一有一亦莫守終日茫茫那事無妨驀拈主丈卓一下心地不生閒草木自然身放白毫光佛誕上堂舉世尊纔生下隻手指天隻手指地周行七步目顧四方云天上天下唯我獨尊拈主丈且道主丈子與釋迦世尊是同是別卓主丈云關上堂舉龐居士云日用事無別惟吾自偶諧頭頭非取捨處處勿張乖朱紫誰為號丘山絕點埃神通并妙用運水及搬柴師云龐居士與麼說話古今徹證者如麻似粟古今錯會者如麻似粟以拂子畫一畫修羅掌中擎日月金鼇背上負須彌上堂僧問淨名杜口行私路和尚如何為舉揚師云的僧云恁麼則一出一沒師云水上掛燈毬僧便喝師云打野榸漢僧云莫道不逢人師云錯乃云諸佛證大涅槃眾生流浪生死拈諸佛底向眾生面前得麼拈眾生底向諸佛面前得麼然則諸佛眾生非一非二到者裡也須明白始得擊拂子下座上堂四月十五日結却布袋頭千兵易得七月十五日解却布袋頭一將難求且道不結不解一句作麼生道擊拂子雲在嶺頭閒不徹水流㵎底太忙生解夏小參百千法門無量妙義但向己求莫從人覓所以臨濟大師道一念清淨心光是你屋裡法身佛一念無分別心光是你屋裏報身佛一念無差別心光是你屋裏化身佛如斯見得鎔瓶盤釵釧為一金攪酥酪醍醐為一味明月堂前時時九夏太陽門下日日三秋誰管你長期短期克念攝念攝念說什麼鵝護雪蠟人氷鐵彈子然雖如是若是飯籮裡坐餓死漢水裏沒頭浸渴死漢又爭怪得拈主丈卓一下一把生芻拈未罷六環金錫響遙空復舉昔有一老宿一夏已來並不與師僧說話有僧自歎云我只與麼空過一夏不敢望和尚說佛法得聞正因兩字也得老宿聊聞乃云闍梨莫𧬊速若論正因一字也無與麼道了叩齒云我適來不合與麼道隔壁有老宿聞云可惜一釜羮被兩顆鼠糞汙却師云者老宿一夏不與師僧說話末後又道正因一字也無撿點將來鼻孔在者僧手裡且道隔壁老宿與麼道具什麼眼良久不入洪波裏爭顯弄潮人上堂應眼時若千日萬象不能逃影質應耳時若幽谷大小音聲無不足拈主丈一大藏教詮註不及達磨西來是證明底人卓主丈九衢公子遊花慣未第貧儒感慨多中秋謝侍者上堂不是禪不是道南北東西謾尋討昨夜日輪飄桂花今朝月窟出芝草阿呵呵好不好是聖是凡俱靠倒犀牛扇破索犀牛老婆心切鹽官老首座至上堂舉大慧和尚在雲居作首座一日到西積莊遇一暫到從圓通來云因看首座頌女子出定話有箇悟處特來求首座印證大慧云你去你去不是僧云某甲未說見處為什麼道不是大慧再三搖手云你去不是不是其僧懡㦬而退師云者僧看頌女子出定話有箇悟處陳年曆日妙喜老人再三搖手云你去你去不是土上加泥驀拈主丈卓一下牛胎生象子碧海起紅塵示眾樵歌來疊嶂帆影落汀洲胡孫戴紙帽直上樹梢頭七星劒五雲樓毬打人兮人打毬萬事難把玩魚吞水面漚開爐山主藏主侍者至上堂山高暴寒凍縮如蝟竹山無佛法可說只舉火爐頭話也要大家知委茶陵郁和尚過橋喫攧解道明珠絕纇則且置婆子請轉藏趙州遶禪床一帀德山纔浴出廓侍者度一盌茶畢竟是何道理拈主丈阿呵呵囉囉哩一抽三二添四臨濟大師無本據卓主丈上堂百億四大海在汝諸人頂門上百億須彌山在汝諸人脚跟下要住即住要行即行眼頭各自看風煙莽莽鹵鹵河沙數驀拈主丈卓一下佛成道上堂六載雪山修苦行無端𦘕虎反成狸明星出現不出現總是勞生證道時行者落髮頂𩕳一著千聖不傳剗草殿前翻成特地沙彌付衣向袈裟下得人身者如爪甲上土向袈裟下失人身者如大地中土良久滄海非深黃連非苦除夜小參天地最靈猶三年一閏乃成其功今年三百九十日正當極盡之夜未免與大眾家話片時德山示眾云今夜不答話有問話者三十棒時有僧出禮拜山便打僧云某甲話也未問為什麼便打山云你是甚麼人僧云新羅人山云未跨船舷好與三十棒竹山若作者僧當時見他道今夜不答話有問話者三十棒便與掀倒禪床非唯免者老漢和泥合水喚鐘作甕亦使天下衲僧有出身之路且道據箇什麼道理便解恁麼拈主丈機關不是韓光作莫把𮌎襟當等閒復成一偈衲僧日用事何如烏兔奔忙歲又除法法由來本空寂三千剎海一蘧蘆上堂舉仰山問溈山如何是真佛住處溈山云以思無思之妙返思靈𦦨之無窮思盡還源性相常住事理不二真佛如如仰山於言下頓悟師云大小溈山錯下名言真佛住處了沒交涉仰山於言下頓悟大似認驢鞍橋作阿爺下頷喝一喝上堂春種一粒種秋收萬顆子四海無閒田農夫猶餓死我等沙門釋子飢則喫飯熱則乘涼莫謂曩劫修來非從今日良久大海若知足百川應倒流結夏小參九旬無虗棄之功黑牛臥死水百劫在今時之用癩馬繫枯樁西天以蠟人為驗一犬吠虗東土以鐵彈子為驗千猱啀實殊不知衲僧分上如擊石火閃電光構得構不得未免喪身失命然雖如是猶是無風帀帀之波更須知有向上一路拈主丈主丈且將留靠壁草鞵乾曬待秋風上堂佛法遍在一切處一切處不可作佛法商量拈主丈薰風自南來殿閣生微凉古人於言下頓悟又作麼生卓主丈禹力不到處河聲流向西解夏上堂十五日已前結得解不得十五日已后解得結不得正當十五日結也結得解也解得雲門扇子𨁝跳上三十三天築著帝釋鼻孔東海鯉魚打一棒雨似盆傾拈主丈朝悠悠暮悠悠一葉落天下秋上堂僧問一喝分賓主照用一時行離此二途請師別道師云壁上安燈盞堂前置酒臺進云從來疑著和尚師云汝是甚處人事進云作家師云老僧失利乃云凡夫實謂之有二乘柝謂之無菩薩謂之當體即空拈主丈卓一下三期事畢萬行功圓不須掘地覓青天中秋上堂四時遷謝轉眼不同方見火雲燒碧漢又逢丹桂落秋風拈主丈多向天邊看皓月不知身在廣寒宮上堂聞說如來頓教門恨不滅除瓴瓦碎古人說破驗在今日哭不得笑不得落霞與孤鶩齊飛秋水共長天一色開爐上堂出家端為究心宗烏兔奔忙夏又冬莫管萬山寒氣重地爐榾柮夜通紅拈主丈無神通菩薩為甚足跡難尋靠主丈下座祖忌拈香梁王殿上滿口含霜少室峰前皴眉甞醋插香云夜暗晝明西天東土上堂言而足終日言而盡道言而不足終日言而盡物以拂子畫一畫道物之極一畫畫斷楚王城畔汝水東流冬至小參實際理地不受一塵佛事門中不捨一法山僧住此深雲已是一十三年與大眾同逢至節凡曰小參未甞不舉古談今多是掉在無事甲裡只如洞山與泰首座喫果子次洞山云有一物上拄天下拄地黑如漆常在動用中動用中收不得未審過在什麼處泰首座云過在動用中洞山令侍者掇退泰首座果卓恁麼說話若作佛法商量有甚交涉不作佛法商量有甚交涉明眼人一點也謾佗不得其或尚留觀聽未免煩主丈子分明說破卓主丈復成一偈舉似大眾誰看葭管動飛灰管取陽和地底回鐵樹糝花橫古壑虗空供笑滿驢腮上堂善財深入毗盧閣帝釋高昇善法堂紫籜峰頭日卓午破沙盆煑菜根香擊拂子下座除夜小參謝首座維那舊歲已盡新歲將臨萬仞峯頭氷枯雪老無可與大眾分歲未免炊鐵釘飯煑木札羮等閒一飽能消萬劫之飢且道仰山夢昇天宮第二座說摩訶衍法克賓維那法戰不勝興化棒了罰錢畢竟是同是別拈主丈西天胡子沒髭鬚昨夜面南看北斗上堂舉僧問虎丘隆禪師如何是大道真源虎丘云和泥合水僧云便與麼去而如何丘云截斷草鞵跟師云大道真源問最親答云截斷草鞵跟茫茫宇宙人無數幾箇知恩解報恩上堂山下炎如甑山間涼似秋得居山上者知是幾生修我等沙門釋子自合知慚識媿退步就己究明千聖不傳者一著子所以道將此深心奉塵剎是則名為報佛恩上堂舉東山和尚示眾云百鍊黃金鑄鐵牛十分高價與人酬庭前不有花含笑又是東山一夏休亦成一偈舉似大眾鞭索俱忘露地牛有何價數可相酬碧梧庭際初飄葉誰肯言休即便休
