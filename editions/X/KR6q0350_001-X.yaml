body:
  text: 初住慶元路延慶禪寺語錄門人宗義省端編師於至順元年庚午秋八月初四日在本路萬壽禪寺首座寮受請次日入寺指山門云頂門具眼未舉先知水到渠成雲開月現佛殿燒香云生佛已前一段奇特大事今朝覿面相呈便禮拜據室明鏡當臺物來斯照錦鱗躍浪鈍鳥棲蘆陞座拈香云此香端為祝延今上皇帝聖躬萬歲萬歲萬萬歲陛下恭願金輪統御壽等乾坤玉燭均調明踰日月次拈香云嗅之則全無氣息用之則炙地熏天人言價重娑婆我謂分文不直爇向爐中供養前住平江路薦嚴禪寺楊岐第十一世竺元道和尚用酬法乳之恩斂衣就座上首白椎云法筵龍象眾當觀第一義師云機先覓妙空裏㘽花語下求玄水中捉月如有作家禪客不妨對眾決疑僧問一人有慶兆民賴之學人上來請師祝聖師云劫石有消日君恩無盡時進云祝聖已蒙師指示向上宗乘事若何師云鐵牛對對黃金角進云解吹無孔笛天下總聞聲師云伸手不見掌進云若不登樓望焉知滄海深師云竇八布衫穿進云與麼則感恩有分師云八花毬子上不用綉紅旗僧禮拜師乃云罷訪諸方知識來歸古鄮城中土面灰頭養問四壁其奈宿緣難避來主江干蕞爾禪林水遶千村槎橫斷港數聲柔櫓一曲漁歌煩佗真正舉揚直是超情絕謂無端擊動法鼓緇素駢臻更欲山僧為蛇𦘕足法昌對泥像說法事急計生風穴單丁七年巧盡拙出汾陽弄西河獅子神頭鬼面楊岐㘽田博飯喫鐵心石膓者一隊老古錐熏天富貴裝出徹骨貧窮新延慶則不然竪拂子天上有星皆拱北人間無水不朝東復舉趙州因僧問狗子還有佛性也無州云無師云趙州狗子無佛性古今多少錯商量自從六國平來后蕩蕩無為化日長上首白椎云諦觀法王法法王法如是上堂風不鳴條雨不破塊洞山於金剛嶺上栽松溈山到國清寺裏受戒東海烏鰂南山筀筍總是自家買賣更問如何漆桶不快拍禪床下座上堂建法幢立宗旨明明佛敕曹溪是永嘉大師雖竪降旗大似偷鈴掩耳以拂子畫一畫一把柳絲收不得和烟搭在玉闌干開爐上堂衲僧活計無多子放下諸緣緩作程品字柴頭煨正暖不知紅日又東昇上堂舉汾陽和尚示眾云識得主丈子行脚事畢三角云識得主丈子入地獄如箭射師云二尊宿總被主丈子穿却延慶則不然拈主丈冬不寒臘后看除夜小參僧問一年將盡夜萬里未歸人如何是未歸人師云眼似鼓椎進云誰知遠烟浪別有好思量師云碧落無贗木進云一言截斷千江口萬仞峰頭始得玄師云錯認定盤星乃云纔見冬至又逢歲除兩曜奔忙萬物代謝浮生若此榮枯得失徒自紛紜我沙門釋子無饑寒之迫無征役之勞二六時中合作麼生支準求玄妙枉費精神無事無為又成莽鹵臨濟大師道有一無位真人常在汝等諸人面門出入未證據者看看恁麼說話也是萬里崖州良久明年更有新條在惱亂春風卒未休復舉投子因僧問如何是十身調御投子下禪牀立又問凡聖相去幾何投子下禪牀立師云大小投子將官路當人情傷鹽傷醋過犯彌天上堂雞銜燈琖走鼈吹釣魚竿寶劒當空擲神光照膽寒以拂子畫一畫波斯嚼碎三斤錢莫向金剛腦后看元宵上堂叢林中纔見說燈籠與露柱交參便作奇特商量及乎尋常說話是對面蹉過以拂子畫一畫今朝正月十五今夜處處放燈佛誕上堂如來降誕在今朝摩耶夫人是其母指天指地語拈得謾神嚇鬼二千年兒孫幾箇能知有令行雲門也是蝦跳不出斗競將惡水驀頭澆大地山河顛倒走上堂僧問金剛眼中著得什麼師云著得什麼則且置汝喚什麼作金剛眼進云學人不會師云問取燈籠進云十二時中如何用力師云無汝用力處僧禮拜師乃云臥病丈室久不上堂然語言有間此法無間日夜惟憑森羅萬象墻壁瓦礫為眾敷揚所以道塵說剎說熾然說三世一切說擊拂子若將耳聽終難會眼處聞聲方始親喝一喝示眾龜毛拂子兔角杖拈向人前任度量昨日前村行一轉田田水滿稻花香擊拂子下座解夏上堂舉翠巖參和尚示眾云一夏與師僧東語西話看取翠巖眉毛還在也無師云多財善賈長袖善舞撿點將來也是賊過后張弓上堂舉教中道知見立知即無明本知見無見斯即涅槃拍禪床世事但將公道斷人心難與月輪齊祖忌拈香冷坐九年和麩糶麵手擕隻履賣狗懸羊年年十月初五日多費兒孫一瓣香上堂昨日有一僧自羅浮來一僧自南嶽來一人頭長脚短一人額闊眉低總有佛法身心且道那一人合受人天供養以拂子畫一畫巴峽猿啼霜月曉斷腸何必待三聲佛成道上堂釋迦老子生在王宮鼻孔大頭向下雪山苦行六年鼻孔大頭向下夜覩明星悟道鼻孔大頭向下擊拂子幾多杜撰巡官只管敲磚打瓦歲旦上堂舉黃龍南禪師因僧問舊歲已去新歲到來不涉二途請師指示龍云東方甲乙木師云者僧大似向繡針眼裏躍出衝浪錦鱗其奈黃龍向冷灰堆中撥出亘天紅𦦨且道涉二途不涉二途有指示無指示拈主丈卓一下李將軍有嘉聲在不得封侯也是閒上堂昨日歸自城中道傍田翁相邀少憩眼見耳聞無非清淨性中流出成得一頌今朝舉似諸人小圃新薑露紫芽荳緣籬落半乾花兒童總角赤雙脚釣得錦鱗歸自誇便下座上堂前半夏已過堂前鐵鋸舞三臺后半夏未來眼裡瞳人吹木叫即今中夏猢猻上樹尾連顛洞山五位臨濟三玄拈向一邊久雨乍晴各宜曬㫰皮草解夏上堂九夏安居事已圓百千億劫亦如然獼猴撲碎軒轅鏡出草菸菟角指天上堂僧問有言有說皆是世諦之談無言無說未是衲僧行履處幸對人天請師垂示師云數聲清磬是非外一箇閒人天地間進云專為流通師云無油不點燈僧禮謝師乃云萬法是心光諸緣惟性曉本無迷悟人只要今日了西天四七東土二三天下老和尚總是未了底漢擊拂子水流黃葉來何處牛帶寒鴉過別村上堂拈主丈喝一喝卓主丈云了便下座上堂菩提涅槃真如解脫是諸佛之所證無明煩惱妄想塵勞是眾生之業惑只如世界未成無佛名無眾生名如上許多絡索畢竟向甚處安著良久任從滄海變終不為君通台州路紫籜山廣度禪寺語錄門人思齊思靜編師於至正二年壬午冬十月初一日入寺指山門云入此門來莫存知解泥牛吼月木馬追風佛殿燒香云百千諸佛向一毫頭上識取金屑雖貴落眼成翳據室我此法印為欲利益世間故說拈主丈道得也三十棒道不得也三十棒卓主丈車不橫推理無曲斷拈衣雞足山中翻成特地黃梅夜半愈覺乖張今日籜峰親授受披來非短亦非長院劄此是當今聖君賢相密護大法底句子度劄云不妨對眾宣揚三宗諸山疏說而默默而說喚鐘作甕證龜成鼈瑚枝枝撐著月江湖疏越山吳水春樹暮雲威鳳祥麟自出群指座法空寶座人人共登須彌燈王猶較一級登座拈香祝聖罷斂衣就座護聖和尚白椎云法筵龍象眾當觀第一義師云有問有答未出常情無事無為猶存知解莫有獨脫無依底麼不妨相見僧出問崑山那畔肯笑堂前歸源正印早已親傳今日籜峰祝聖開堂願聞法要師云須彌頂上擊金鐘進云逈然一句超今古高蹈毗盧頂上行師云不打者鼓笛進云昔日保壽開堂三聖橫身相為臨濟住院普化盡力扶持畢竟明箇什麼師云兩頭俱坐斷一劒倚天寒進云與麼則五位君臣齊裂下三玄戈甲一時收師云錯下名言僧喝一喝禮拜歸眾師云亂統禪和如麻似粟乃云如我按指海印發光古佛堂前敲空覓響非風旛動仁者心動曹溪路上好肉剜瘡直饒別有生涯也是和泥合水今日新廣度為國開堂畢竟合談何事新羅與占波鬬額燈籠與露柱交參一切智智清淨無二無二分無別無斷故正恁麼時且道腦后一句是第幾機良久好把一枝無孔笛等閑吹出萬年歡復舉夾山因僧問如何是夾山境山云猿抱子歸青嶂裡鳥銜花落碧巖前法眼云我二十年只作境會師云夾山放去太奢法眼收來太儉撿點將來總未有出身之路護聖和尚再白椎云諦觀法王法法王法如是當晚小參僧問言前薦得猶為滯殻迷封句下承當未免觸途成滯學人上來請師方便師云牡丹花下睡猫兒進云只如疏中有語非惟事理圓融且喜師資會遇又且如何師云堂前鐵鋸舞三臺進云與麼則青山不鎖長飛勢滄海合知來處高師云嘉州大象喫鹽多陝府鐵牛添得渴乃云安洲管內紫籜峰頭昔混源密禪師洎屢代名德唱道之地實東南之覺場龍象之淵藪無似之蹤祗奉院命繼席茲山誠為叨忝賴有暮翁老和尚在上伏望壽同趙州以永佛祖慧命寅夕得遂咨扣幸莫大焉然叢林小參謂之家教其間鍋子大小杓柄短長未暇撿點諒惟我此一眾猶百鍊精金慣調良驥見超量外不待繁詞復成一偈舉似大眾長庚籜頂半千里多士偕行不憚勞主丈且將留靠壁同看千嶂起波濤謝首座藏主上堂人天眼目堂中上座通人分上未舉先知大藏小藏全提半提是甚熱椀鳴聲青蘿夤緣直上寒松之頂白雲淡泞出沒太虗之中擊拂子下座上堂舉明招示眾云者裏風頭稍硬且歸煖處商量眾隨至方丈招云纔到煖處便瞌睡去以主丈一時打散師云老明招拋出一機不妨奇特當時一眾若是靈利衲僧待他道且歸煖處商量便好一時散去教他獨眼龍有理難伸下座上堂夜繩不動疑之為蛇暗室本空怖之有鬼昆明池裏失却劒曲江江上撈得鋸阿呵呵囉囉哩鴶鷯舌頭三千里上堂與麼與麼得之於心伊蘭作旃檀之樹不與麼不與麼失之於旨甘露乃蒺藜之園鐘樓上念讚床脚下種菜勝首座道猛虎當路坐又作麼生擊拂子下座冬至小參僧問還丹一粒點鐵成金至理一言轉凡成聖學人上來請師一點師云頭長脚短進云只如僧問古德如何是冬來事古德云京師出大黃又作麼生師云舌上覆金錢進云初心後學乍入叢林和尚豈無方便師云秤鎚鋸解血淋漓乃云教中道法離見聞覺知若行見聞覺知是則見聞覺知非求法也天左旋地右轉日東上月西落寒來暑往陰極陽生鐵樹開花氷河發𦦨君子道長小人道消喚作見聞覺知得麼不喚作見聞覺知得麼如斯解會正是認影迷頭所以道放行則怛薩舒光把住則泥沙匿耀拈主丈野色更無山隔斷天光直與水相連上堂深山巖崖無佛法石頭大底大小底小一冬二冬叉手當𮌎籬頭吹觱栗元是夜來風上堂舉趙州一日在井樓上見南泉過以手抱樓柱叫云相救泉以主丈擊樓柱五下而去州便具威儀上方丈謝云適來謝和尚相救師云殺人刀活人劒除夜小參一年三百六十日今夜歲盡年窮諸方說妙談玄者裏應時納佑西天四七東土二三天下老和尚總是打淨潔毬子抱不哭孩兒底漢譬如琴瑟箜篌雖有妙音若無妙指終不能發衲僧分上不在多端地凍天寒伏惟珍重復舉僧問古德年窮歲盡時如何古德云東村王老夜燒錢師云東村王老夜燒錢江上漁翁把釣竿多少徧參雲水客含元殿裡覓長安元旦上堂元正肇祚萬物咸新恭惟兩序大眾各各起居多福三九二十七菩提涅槃真如解脫是甚敲門瓦子擊拂子但得雪消去自然春到來元宵上堂舉教中道一切眾生具有如來智慧德相只為妄想執著而不證得乃云燈籠㳂壁上天台寒山拾得笑咍咍自有一雙窮相手不曾容易舞三臺上堂拈一莖草作丈六金身將丈六金身作一莖草好大眾不是苦心人不知便下座上堂舉三聖道我逢人則出出則不為人興化道我逢人則不出出則便為人師云耳朵兩片皮牙齒一具骨無人過價打與五伯上堂僧問文殊與普賢萬法悉同源文殊普賢即不問如何是同源底法師云胡張三黑李四進云一毛吞巨海於中更何言師云不勞懸石鏡天曉自鷄鳴進云是非不到處還有句也無師云誠知你亂會乃云小乘錢貫大乘井索有漏笊篱無漏木杓東卜西卜七錯八錯辱不辱足不足樂不樂雪峰輥木毬普化搖鈴鐸上堂十五日已前師子不咬麒麟十五日已後猛虎不食伏肉正當十五日水上掛燈毬良久但得螺螄吞大象泗洲出現在楊州浴佛上堂竪起拂子即今釋迦世尊在山僧拂子頭上誕生頂上灌九龍香水足下敷百寶蓮華汝等諸人還見麼直饒見得倜儻分明也是迷頭認影擊拂子結夏小參釋迦老子二千年前在靈山會上事不獲已立箇法門謂之禁足護生剋期取證迨今天下叢林遵行莫違西天以蠟人為驗東土以鐵彈子為驗竹山今夜擊鼓集眾初無許多閒家潑具只向諸人道參須實參悟須實悟今日是三明日四雪霜容易上人頭復舉古德云道不得底句不在天台定在南嶽師云一句明明定古今天台南嶽謾追尋子期去後人何限流水高山孰賞音上堂倒跨楊岐驢蹈翻華藏海文殊普賢窺覰無門狸奴白牯放光動地會醫還少病知分不多愁上堂舉長慶稜道者廿年坐破七箇蒲團只管看驢事未去馬事到來因卷簾大悟說箇頌云也大差也大差卷起簾來見天下有人問我解何宗拈起拂子劈口打師云有般底聞與麼道便將情識搏量刺腦入膠盆殊不知我王庫內無如是刀便下座上堂古㵎泠泠亂峰矗矗拈得鼻孔失却眼睛喝一喝進退兩序上堂或進或退或左或右扶已墜之綱宗碎衲僧之窠臼敵勝還他師子兒驚群須是英靈手擊拂子下座上堂古德云譬如牛過窓櫺頭角四蹄都過了只有尾巴過不得師云且道誵訛在什麼處良久一言已出駟馬難追上堂有物先天地無形本寂寥能為萬象主不逐四時凋拈主丈古人忍俊不禁和盤托出爭奈美食不中飽人喫卓主丈下座解夏小參一夏九十日今已告圓山僧未嘗蹉口道著佛法二字諸人每日著衣喫飯何曾欠少一絲毫好箇古佛家風直是超情絕謂今夜鼓寂鐘沈無端諸人上來剛要𦘕蛇添足古德云我若真正舉揚法堂前草深一丈隨汝顛倒所欲南斗七北斗八竹山則不然今年桃李貴一顆直千金上堂三世諸佛舌頭無骨六代祖師眼裏無筋古廟香爐雖冷燒却諸人面門莫言不道便下座中秋上堂舉教中道修多羅教如標月指若復見月了知所標畢竟非月拈主丈恁麼說話大似嚼飯餧嬰孩面皮厚多少卓主丈下座上堂釋迦掩室於摩竭淨名杜口於毗耶須菩提巖間宴坐天帝釋空中雨花古今日月古今山川大鵬一舉九萬里蟠桃結實三千年上堂舉雪峰示眾云盡大地撮來如粟米粒大拋向面前漆桶不會打鼓普請看師云老雪峰不妨賣悄拋向面前會與不會則且置打鼓普請看是什麼閒開爐上堂衲僧萬慮不干懷妙用頭頭自偶諧寒夜地爐無宿火明朝山上有生柴上堂佛真法身猶若虗空應物現形如水中月驀拈主丈釋迦世尊即今走入露柱裏去也汝等諸人因甚鼻孔失却半邊靠主丈下座上堂僧問智不到處切忌道著道著時如何師云文不加點進云與麼則無處容身也師云貴買賤賣進云官不容針私通車馬師云七差八錯僧禮拜師乃云三界二十五有是幻四大五蘊六入十二處十八界是幻樓臺殿閣人畜草木凡所有相悉皆是幻畢竟喚什麼作實相良久一聲天外鴈孤客已先寒上堂舉雲門示眾云乾坤之內宇宙之間中有一寶秘在形山拈燈籠向佛殿裡將山門安燈籠上師云中有一寶秘在形山大小雲門蹉過也不知拈燈籠向佛殿裡將山門安燈籠上竹山要斷不平拈主丈大盡三十日小盡二十九佛成道上堂逾城出家六年苦行夜覩明星成無上覺顢顢頇頇莽莽鹵鹵掇轉南辰向北看五五依然二十五上堂至道無難唯嫌揀擇但莫憎愛洞然明白以拂畫一畫寒則向火熱則乘凉元旦上堂新年頭無佛法可說惟願皇圖永固佛日增輝四海晏清萬民樂業我衲僧家用捨有時進退合禮頭頭妙用物物全彰良久臥龍纔奮迅丹鳳便翱翔元宵上堂最初一句末後一機直下構得燈籠露柱動地放光其或未然竹山今日失利上堂我此間也無禪也無道也無玄也無妙只有一口劒佛來也斬魔來也斬眾中忽有人出來道借和尚劒看只向他道三年一閏五年再閏佛涅槃上堂諸佛不出世亦無有涅槃但以假名字引導於眾生昨夜南山虎咬大蟲蛇吞鼈鼻畢竟是第幾機喝一喝上堂三分春光二分過衣單之下事如何勞生只有僧無事莫教蹉跎兩𩯭皤上堂舉趙州一日在東司頭見文遠侍者過乃喚文遠遠應諾州云東司頭不可與汝說佛法師云趙州謾文遠侍者即得若是眼睛定動底教它屙也不了侍者醫士至上堂一十八年紙襖上抄來底好箇陳年藥方若是攢簇不得底病總用不著拈主丈昨夜洞庭湖火發燎却嘉州石像眉毛卓主丈下座佛誕上堂盡道釋迦老子二千年前於淨飯王宮摩耶夫人右脇誕生又道未離兜率已降王宮未出母胎度人已畢拈主丈虗空裡釘橛底有甚數飯籮裡撒屎底有甚數卓主丈上堂舉教中道見明之時見非是明見暗之時見非是暗見空之時見非是空見塞之時見非是塞見見之時見非是見見猶離見見不能及師云金剛與泥神揩背燈籠與露柱交參處處綠楊堪繫馬家家門戶透長安聖節邑中陞座問答罷乃云雲從龍風從虎聖人作而萬物覩是以山河藉聖人而永固日月藉聖人而長明百官藉聖人而祿位常居萬民藉聖人而畊桑樂業四時適序五穀豐登賢俊挺生鳳麟呈瑞皜皜乎不可尚矣巍巍乎莫能名焉且道林下衲僧畢竟如何慶讚良久但見皇風成一片不知何處是封疆復說偈云大哉萬乘尊天下蒼生父神聖越唐虞謨烈超文武百億須彌盧壽山高莫比無邊香水海福海亦如是上堂一塵飛而翳天一芥墮而覆地蝦蟇蚯蚓悉證圓通牆壁瓦礫常宣妙義拈主丈大田多稼飽甘霖喜色歡聲滿寰宇上堂日往月來星移斗換一夏九十日如今已過半溈山水牯牛拽脫鼻圈則且置德山卓牌於閙市畢竟意在於何喝一喝上堂舉盤山積禪師示眾云心月孤圓光吞萬象光非照境境亦非存光境俱亡復是何物師云天台則有南嶽則無趙州東壁掛葫蘆上堂十五日已前即心即佛十五日已後非心非佛正當十五日不是心不是佛不是物三家村裡生苕帚十字街頭破草鞋解夏小參僧問千峰頂上善法堂前聖制告圓請師提唱師云家家門前赫日月人人手裡明月珠進云文殊三處度夏達磨九年面壁畢竟是同是別師云斷頭船子下楊州乃云仰山一夏不空過鋤得一片畬種得一籮粟溈山一夏不空過日中一飡夜間一寢竹山一夏不空過波波挈挈百醜千拙古今山河古今日月古今人倫阿誰無分長期百二十日中期百日下期八十日總是療狂子之方復舉龐居士問馬大師云不昧本來人請師高著眼大師直下士云一等沒絃琴惟師彈得妙大師直上覰士乃作禮大師歸方丈士隨后入云弄巧成拙師云馬大師當時見居士作禮好劈脊便棒非唯勦絕龐公亦使天下衲僧亡鋒結舌上堂今朝八月初一諸方旦過門開我此萬仞峰頭亦有衲僧來往雖則雲寒水冷誰云接納無方雲門胡餅趙州茶喫著從教綴齒牙中秋上堂舉寒山子詩云高高峰頂上四顧極無邊獨坐無人知明月照寒泉泉中且無月月自在青天吟此一曲歌歌中不是禪師云竹山未免下箇註脚蘇盧蘇盧㗭唎㗭唎便下座上堂古釋迦不前今彌勒非后雪峯輥出木毬普化打翻筋斗堪笑懵衲僧東西競頭走蘇州有常州有連雲和尚并藏主都寺至上堂善知識者是大因緣打開寶藏運出自己家珍津濟四生梯杭九有如我連雲和尚六坐道場以無文印印破天下衲僧面門直得龍驤虎驟嶽聳波騰且道同風句子畢竟如何舉唱良久楊岐牽犁九峯拽耙上堂一月普現一切水一切水月一月攝驀拈主丈卓一下空山秋半老萬木正凋黃下座行者落髮體性圓明諸法無我一呼善來鬚髮自墮沙彌付衣龍披一縷金翅不吞盜匿冢間鬼神莫近此是解脫服汝等應受持上堂舉世尊在靈山會上拈華示眾爾時大眾默然惟迦葉尊者破顏微笑世尊云吾有正法眼藏涅槃妙心實相無相微妙法門不立文字見性成佛付囑摩訶迦葉師云眼裡著不得沙耳裡著不得水十字街頭握手三家村裏逢渠風吹柳絮毛毬走雨打梨花蛺蝶飛祖忌拈香不露蓋膽毛唯缺當門齒無端歷魏遊梁剛道單傳直指插香云殃害藂林猶未已上堂生佛已前有一句子三賢十聖窺無門一大藏教詮註不及竹山真不掩偽直不藏曲拋向諸人面前貴在大家知有以拂子畫一畫窮驢欠一尺富狗剩三寸下座上堂報化非真佛亦非說法者釋迦世尊降誕於迦毗羅城說法於波羅奈國且道是真佛耶非真佛耶以拂子畫一畫當門不用栽荊棘後代兒孫惹著衣冬至上堂時臨長至陰極陽生樹上鯉魚產子庭前石筍抽萌法性海中湛然常寂塵勞界上雨施雲行拈主丈天高地下鼻直眼橫下座施主齋僧并藏主至上堂盡大地是王老師檀越盡大地是自己光明藏若能於食等者於法亦等於法等者於食亦等且道不落古今不傷物義一句又如何話會良久幾度黑風翻大海未嘗聞道釣舟傾上堂舉永嘉云損法財滅功德莫不由斯心意識師云喚什麼作法財喚什麼作功德喚什麼作心意識拈主丈黃河三千年一度清佛成道上堂諸佛證菩提眾生徇煩惱菩提與煩惱非一亦非二展手即成掌握手即成拳水動即成波波澄即是水六年往雪山垂範示后昆午夜覩明星目眩生花爾普告諸仁者諦審復諦觀於此剎那間證成無上覺上堂各各照管自己田園自然時清道泰物阜民康釋迦出世不出世達磨西來不西來了沒交涉拈主丈卓一下除夜小參虗空不動無古無今歲月遷流有新有舊家家門戶祭鬼燒錢竹山今夜無佛法可說無世法可說只舉一則古話供養大眾舉手云囉囉招囉囉搖囉囉送莫怪空疎伏惟珍重歲且謝新舊兩序上堂舉教中道一切賢聖皆以無為法而有差別今朝是正月初一舊兩序已退新兩序依次出班大眾隨例問訊一一天真一一明妙畢竟喚什麼作無為法擊拂子如今要見黃頭老剎剎塵塵在半途先師暮翁和尚入祖堂無異堂前展兩手處識得根源被人鈍置不少紫籜峯頂一十七年敲空作響還佗位次安排置牌云大家團圝頭共說無生話元宵上堂眼若不𥧌諸夢自除心若不異萬法一如人天交接兩得相見須彌山上走馬大洋海底挑燈上堂善逐情生如珠放光還照珠體惡從心起似鐵孕垢自毀鐵形所以道天堂與地獄皆由心所造拈主丈芍藥花開菩薩面椶櫚葉散夜叉頭佛涅槃上堂舉世尊入般涅槃日迦葉尊者最後而至世尊於槨內露雙趺示之迦葉尊者乃作禮請如來以三昧火而自闍維即時金棺出七寶牀昇舉繞拘尸羅城七帀却還本處化火光三昧而自焚之師云槨露雙趺示迦葉化三昧火自闍維面皮知是厚多少慣把空拳誑小兒上堂僧問名假法假人空法空請師直指師云曾問幾人來進云無根樹子向什麼處栽師云更深猶自可午后更愁人進云只在目前為什麼再三不覩師云千年常住一朝僧乃云竹山無可款待來賓只有木井水槎塘茶且喜人人舌頭具眼滿甌啜了便道好水好茶良久勞生萬事正如麻擊拂子下座九巖道純和尚至上堂祖師心印狀似鐵牛之機一印印空一印印水一印印泥者箇說話直饒機如掣電眼似流星未免坐在葛藤窠裡拈主丈蹈斷天台石橋笑倒新昌石佛上堂千峯頂上絕諸緣水牯何妨痛著鞭啼鳥落花春已老莫教荒却自家田浴佛上堂佛是了事底人因甚年年將惡水潑佗擊拂子不經一事不長一智結夏小參心法