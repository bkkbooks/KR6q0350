body:
  text: 了堂和尚偈頌門人文度文朗等編次韻贈曙藏主再參靈巖了菴和尚摩尼珠自圓轉舍之則近取還遠大洋海底蓬塵生須彌頂上洪濤卷不是心兮不是佛頂門放出遼天鶻長空雲淨月三更倒持鐵杵敲冰骨既明密意自己邊何須再買三吳船靈巖老人太饒舌令行好擊三百鞭靈壑歌次無言和尚韻靈壑靈壑吾為歌無風自起滔天波回頭已覺滄溟窄朝宗萬派如渠何源遠流來自摩竭銀山鐵壁俱通徹六月陰生火聚凉三冬𦦨發氷河熱靈兮非內壑非外古往今來絕停待月明歌罷夜堂空天風撼動千年檜次中竺古鼎和尚韻贈允藏主展開佛手伸出驢脚露柱燈籠築著磕著特為此事參尋布單枉教賣却一顆如來藏裡珠日用靈光常烜赫贈朗首座一字字一句句覿面提持誰云密付永嘉到曹溪韶陽見靈樹子真師子兒機先知落處七九六十三逢人休錯舉大地春敷五葉華老胡徒自涉流沙大義號上人號大義大義難形諭不在隔江舉火時不在開田展手處父母非我親黑漆昆侖遭指註諸佛非我道狸奴倒上菩提樹三千剎海一一全彰八萬法門頭頭顯露竹山有口莫敷宣從教舉向諸方去送奉藏主江西禮祖大藏小藏全提半提騎聲蓋色帶水拖泥三登投子一宿曹溪天明芻犬吠夜半木鷄啼動靜寒溫宜自愛祖師何獨在江西次無際和尚韻示問禪行者雲鎻萬峰巔苔徑無人跡淨人從何來貌古雙瞳碧自言多記古機緣徧歷諸方叩知識我宗無法與人傳交馳問答誠何益袖裡真金用不親徒將瓦礫閒相擲臨風不覺成太息般若叢林長荊棘次平石和尚韻贈大雲曇藏主遊徧諸方歸石床蘚花碧掀翻五千卷六門頓清適佗觀非正觀無得是真得自媿仍自悔誰會復誰識用舍在當仁古路如絃直扇乾生死海不須金翅翼寄台城虗白居士西祖門庭單傳直指聖不慕佗靈不在己微言妙語滿塵寰總是無用瘡疣紙打破鳳林關斫却𣯛牛尾毗耶城裡老維摩拍手呵呵笑不已次了菴和尚韻送木菴藏主見溍卿先生為歸源老人求塔銘深院無人正岑寂追慕先師慘愁色先師遷化何所之萬疊雲山鎻寒碧木菴淵默聲如雷令我頓覺孤懷開持來了菴法兄偈明珠白璧無纖埃了菴分違屢更歲大法千鈞能負載休居死后到先師傷悼宗門意有在死兮生兮事若何波不離水水即波黃君當今廊廟器詞源浩浩傾天河盛聞書言與書事筆力不減董狐史了庵指子求塔銘叢林有識咸增喜會看勒石成豐誵訛句子難形書每怪古德浪指註如驢覰井井覰驢贈藻維那一了一切了一見不再見霜劒倚天寒殺活分手面興化打克賓臨機少方便出院仍罰錢恩多返成怨若是大冶金百鍊色不變放去與收來何甞不成見茫茫只解問長安不知身在含元殿題王真人月舟圖皎皎天上月汎汎水中舟月或翳雲霧如心縈百憂舟或厄風濤如身困馳求當淨心如月湛然凌素秋當以舟喻身洞視生若浮月本無明暗舟還任去留示小師思齊參方出家入道非小緣當紹先宗明自己汝年十五事參尋臨行囑汝無佗語勿翫山水費光陰勿厭觕糲慕甘美勿輕實德貴虗名勿效無知狎庸鄙吳楚叢林知識多晨參暮請羅萬指棒喝交馳掣電機直須薦取言前旨后生可畏古聖言五十無聞我身是佗日歸來似古靈我亦致齋慶讚汝題無著染上人芬陀利華室瑞世白蓮華梵語芬陀利瑩潔玉雪同馥郁沈檀異觀之色非色嗅之鼻非鼻所以古聖言是法難思議無著染上人視世如幻寄取花以名室是真無著義於中或宴安於中或遊戲此華與此室不即亦不離無邊法界中誰淨復誰穢譬彼太虗空花生眼中翳贈聰藏主遊台鴈僧來問字惟一默金鉤玉線空拋擲狸奴白牯暗嗟噓耀古騰今有何極杖挑日月來天台萬八千丈登崔嵬五百聲聞無處覓石橋飛瀑鳴如雷幡然又欲尋鴈蕩莫把工夫事遊賞詎那猶自未回頭到時好鼓攔腮掌衲僧用處曾不難轉地軸兮回天關大家拗折主丈子笑看千嶂起波瀾性元號為資藏主賦見性成佛佛即性獼猴撲碎軒轅鏡直截根元性非元脫殻烏龜飛上天佛即性也謾甄別性非元也尤親切黑漆昆侖舞柘枝赤脚波斯嚼生鐵道人自是僧中龍揭翻藏海咸讓雄八萬四千塵勞荊棘叢中高懸惠日三百六十骨節旃檀林裡普散香風頓空語默迥脫羅籠使夫一類斷善根闡提知有千聖頂𩕳上不傳之正宗咄示小師妙智參方智過於師方堪傳授大抵相似終不唧𠺕汝丁壯年我趨衰謬勿以名牽勿以利誘廢寢於夜忘餐於晝如溺求援如焚求救知識門庭徧宜咨叩入薝蔔林餘香不嗅至道淵曠終可成就語默行藏色色仍舊佗日歸來禁得罵詬無媿古人吾宗良胄玄立號玄固非玄立亦奚立為萬化之母兮豈言思而可及即真空成妙有兮亦情塵之妄執如是則窮天地亘古今明如日黑如漆取不得捨不得而強號之曰玄立次南堂和尚韻贈清禪客開口即錯端的不容一句道著喪我門風直饒壁立萬仞也須末磨粉舂釋尊推微細禪病明言五蘊初祖具真正知見大破六宗五葉花開震旦萬年松在祝融狸奴倒上菩提樹午夜金烏海底紅送天寧章藏主歸開元省師姑蘇城中古法窟西竺浮來二石佛聞道曾經劫火餘鼻孔依然高突兀道人遠自浮佛來探玄有志非凡才掀翻教典五千卷笑觀雙幘青崔嵬師老歸覲誠尤確脩途不憚風塵惡到時圓相不須呈側身立侍禪床角儻問孤蹤事若何宗乘無補𩯭先皤太湖三萬六千頃雪浪翻空入夢多次芭蕉泉禪師示眾韻三界擾擾何時休窮其起處無端由從迷積迷歷塵劫吾徒自合思回頭晝貪餐夜貪臥米未經篩糠未簸巧飾言詞顯己長妄生枝節求人過野干兒何所宜師子之皮不易披自己田園荒廢了它家物務總能為苦奔波多懡㦬深種煩惱根寧結菩提果一朝蛇入布裩襠魂膽飛怎眠坐叫菩薩誰憐我送思上人之西州妙年思訪道決志尤宜堅未會入門款須防劈面拳沙彌有主無主趙州曾見南泉信手拈來兮氷河發𦦨當頭坐斷兮陸地生蓮若是咬人師子等閑拶透機先知識門庭好咨叩三吳煙浪接遙天次保福一菴和尚韻送鄞侍者遊金陵鑠石流金不我熱折膠墮指不我寒男兒奮志邁往哲抉珠驪頷曾無難壺中但覺日月永量外須信乾坤寬世尊拈花示海眾迦葉當時獨破顏金聲玉振二千載撼動天上並人間靈鋒寶劒常在握自然破敵還斬關此去金陵古城下無事為我拈掇看脫體承當都在汝莫教只管弄疑團贈隱侍者道人索我書長歌尺水誰能興丈波肚裡不留元字脚當知文彩猶嫌多長歌縱書成底用打破虗空重覓縫若人一念自知非六月黃河連底凍從來無妙亦無玄萬象森羅舉不全昨夜南辰移向北阿難依舊世尊邊送方上人遊天台日高蘿窻睡方起道人袖出玉繭紙自言江海久曾遊未到天台心未已天台古今人共遊幾人能解窮清幽穹崖䆳谷金磬響玉芝瑤草天香浮半千尊者樂空寂或隱或顯人不識有時琖裡現茶花有時松根坐苔石衲僧用處天然奇高𢹂七尺烏藤枝一挨一拶儻不解臨機慎勿輕饒伊大梅錄都寺焙藏經有大經卷離言說四聖六凡俱洞徹海藏龍宮五百函眼裡無端著金屑楊岐用處人罕同要覓挂角羚羊蹤紅爐𦦨上舒復卷墨花香霧翻晴空眼觀東南意西北錦標更向何時得彈指圓成八萬門何待佗生問彌勒清心堂雅志遠塵滓深雲構虗堂水澄石磊磊月白山蒼蒼琪樹落秋影瑤草生異香孤坐四檐靜天風透微凉萬慮不相到一片凝氷霜人生貴知止歲月奔風檣誰能苦膏火置身聲利場勾龍道人每口中道吽吽唄三字述此以贈道人道箇吽吽唄頓空言義真奇怪若是驚群師子兒拶透機先何痛快妙乎此道絕疎親猶恐從前認識神直饒一念空三際也是倀倀摸象人回僊不見黃龍老燕石那知非至寶當時牙齒欠關風彼此全身入荒草同中異也異中同消息由來不易通昨夜泥牛鬪入海天明鐵舞翻空示小師思敏侍者再參育王雪和尚鄮峯有宗工迅機如電掣鍛聖與鎔凡竹篦三尺鐵汝欲追再參决志宜猛烈目前事萬端一刀須兩截當年老韶陽何甞有言說紙襖上抄來重添眼中屑老我籜峯頭百醜復千拙臨行覓贈言一口無兩舌自家本有靈光直要覰教通徹其或如存若忘恐無會底時節次韻贈昱上人吾宗論實不論虗毫𨤲有差天地殊南山起雲北山雨東家作馬西家驢江河為舌義難演鐵石作膓恩未孤不許夜行須曉到誰知更有赤鬚胡次東州和尚答古林和尚真蹟韻舜若多神發惡剛把虗空穿鑿木馬奔脫四蹄泥牛驚折兩角爭似鳳臺虎丘傑出叢林高作參徒水赴雲趨迅機雷轟電鑠當陽摵碎破沙盆瑞氣祥光騰碧落贈彌陀昱長老至道無難惟嫌揀擇山高海深烏玄鵠白若是具眼衲僧自然超宗逸格曠大劫不消一瞬何古何今無邊界全在一塵非寬非窄叢林有此出群才何慮聲光不輝赫摩挲老眼碧峯前要觀九萬翔鵬翮韜侍者血書蓮經經名妙蓮花如來真秘訣方便演三乘有語非干舌道人用處尤親切瀝盡娘生指尖血一毫端上見神通百億毫端亦非別讚歎莫及歡喜不徹一會靈山儼然切忌眼中著屑贈天元達書記當年大覺依圓通主賓契合吾宗文字不即亦不離高懸慧日開羣蒙圓通道大動天子大覺誠為天下士銀璫小使頒綸音舉賢代己人罕似淵才雅思自古今宗乘黼黻真知音男兒奮志邁往哲金聲玉振傳叢林送仙巖華石瑛長老古德心心貴相契出世不忘悲願海叢林是處沾恩波藹藹聲光至今在誤讀楞嚴思老安唐言梵語何相干非惟無佛亦無己炎炎六月氷霜寒道人氣岸天然別驪頷明珠手親抉祖翁一箇破沙盆倒用橫拈自超越次韻送振侍者參方只是無師不是無禪斬釘截鐵謬解悞傳若謂超今邁古開口蚤成墮負更言別有生涯對面拋沙撒土直饒納大千於一塵打三更於日午正好拶教面紅知有少室真宗翠巖不得善侍者那明真際分頑空參遍江南與江北須知不假它家力一念回光見得親達磨九年空面壁次韻贈晟維那祖令高提欺胡謾漢越聖超凡轟雷掣電興化打克賓風穴見南院機用隔天淵誰云可同傳直饒靈源湛寂絕滲漓吾宗那可稱傳持指螘垤為太華認蹄涔為歸墟對𦦨爐而受凍坐飯籮而忍飢男兒奮志從師決擇此道毋自欺閻浮身世膠膠擾擾轉眼成衰遲送天童東岡昕書記住天王老南見慈明良遂參麻谷拈起鐵蒺䔧擊碎無瑕玉教苑初遊兮眼中已刮金鎞禪林晚歸兮腦後更抽金鏃寂寥非內兮素範還還寬廓非外兮真規復復挹雙沼之淵澄大雙溪之正續普施法雨勿遲遲無限焦枯待霑沃宗元號宗廓元呵佛罵祖尋流得源上馬見路了無朕跡正好推窮千差萬別八達七通不躡前蹤寧彰後位烈𦦨銷冰迅雷破柱天台竺曇瑞首座扁所居室名四華世界徵伽陀以證無邊剎土本清淨淨土何獨稱西方羣生妄覺淪有海情波識浪何茫茫娑婆釋尊運慈溥隨機演法多門戶十六禪觀乘願輪面奉彌陀子歸父八德池開四色花其地布以黃金沙大如車輪絕傾側微妙香潔分光華天台道人竺曇瑞四華榜室超言義優曇與拘物頭波斯迦及芬陀利經行坐臥於其中浮生萬念春氷融淨名不忘修淨土明知佛國從來空我宗孤危何取舍問著痛棒和聲打滄溟月白吼泥牛大野風生嘶木馬於一毫端洞十虗劃波限域徒區區拈却風前案山子不妨潘閬倒騎驢示莊侍者不慕諸聖不重己靈機如掣電眼似流星敲唱雙行有準師資會遇非輕野鴨飛過時謾它百丈侍郎有省處不打三平聲前破的腦后抽釘拋鐵網於泰華捉麒麟於滄溟幾多癡狂外邊走兩耳卓朔頭鬅鬙贈日本俊藏主單傳直指絕學無為頓空華藏海抹過毗盧師無量法門都來在汝百千億劫不出今時逆施倒用見教徹德山臨濟還堪追示淨藏主活袞袞明落落儗心早已成纏縛一毫端上識根源八萬法門頓昭廓是不是非不非徒將情解窮玄微黃龍拈出斷貫索兩川義虎方知歸最初機末后著瘥病不假驢駝藥藏裡摩尼自古今天邊日月何輝赫示度藏主參至無參學至無學是聖是凡全歸掌握七十二汀鄞水遠入東溟萬八千丈台山高齊南嶽喜有路而可行笑無繩而自縛毗盧藏海盡掀翻回頭好截蒼龍角次韻贈初侍者出格言到家句古往今來幾人舉如來禪祖師意大抵難傳㽄嗄器釋尊詳說對阿難正倒只輪金色臂不在推窮尋逐時擡眸早已三千里溈山只牧水牯牛不用手中三尺箠男兒參叩勿遲遲昨夜金風生玉宇次韻贈守侍者潦倒雲門云念七接響承虗至今日拈得七兮失却一運斤須還受斤質迦葉明明不覆藏始信如來語非密陳年一等葛藤窠對眾何勞重拈出厇愬金毛師子兒頂門正好施一錐祖域高深不易到欲成大智先成愚臨濟會下赤梢鯉誰道千非博一是末后非逢老夾山翻身爭入洪濤裡贈中竺傑侍者覺海澄圓性天朗耀照而常寂寂而常照倒握烏藤驀面揮誰知特地開懷抱君不見世尊拈起一枝花金色頭陀獨微笑惟敲瓦鼓唱巴歌看佗合出陽春調有放復有收自起還自倒次韻默菴歌贈唯維那我宗從來無語句金舂玉應何差互巖間宴坐老空生雨花天帝尋無路南海波斯吹鐵笛泥牛側耳知端的紛紛覓妙參玄人幾箇能禁惡拳踢裙衫抖擻尤難知無端太阿成倒持𦦨發氷河自閃鑠糝花枯木徒芳菲莫教守住英靈窟直須東涌復西沒伽陀書罷倚危闌天風磨出蒼崖骨于石號介侍者求上人志道堅于石石堅貴韞無瑕璧良工剖琢石非堅志堅道可窮玄極落落當從自己求碌碌休向它山覓生公說法曾點頭五百力士空施力次韻贈閏侍者東土隔西天何妨密相付覓妙與尋玄邯鄲學唐步頭頭總見前法法成差互達磨老臊胡元來不是祖神光乞安心來機曾不副從頭點檢看五五二十五當爐能不避火熱誰謂同途不同轍看它赤手坐重關把斷何曾通水泄一機瞥轉威音前拈起死蛇活潑潑百萬人中輥出來自然用處天然別因憶金巒善侍者翠巖親遭痛摧折當時不得老慈明滿懷冤屈憑誰雪贈日本登侍者香林遠侍者久入韶陽室韶陽道不涉言詮紙襖無端浪傳出悞它學語禪流轉增煙霞痼疾吐得氣轉得身去却七三存一百尺竿頭進步時搏桑日上瑚枝答龍華穆菴法姪康長老韻四海禪流自旁午少室宗乘待人舉南堂嫡子鳳臺孫地褊善於長袖舞迅機一喝如雷奔要使正眼開頂門焦枯溥沃會有日黃河九曲來崑崙次蘿月瑩公墨蹟後以智拔先定動自然空盡塵勞夢棒喝交馳建法門直教喪膽還驚魂妙喜舌底風雷卷點鐵成金丹九轉蘿月道人何所參馬頭北也牛頭南我之所說譬時雨塞却耳根須聽取古今𦦨續與芳聯佛祖曾無一法傳次韻送我藏主再參中竺季潭和尚未明三八九難蹈古皇道白璧鑿石終自逢青天掘地從渠討是藥採將來拈起一莖草機先領旨何疑可疑量外明宗弗好也好五千餘卷葛藤窠十聖三賢俱絆倒要作德山臨濟下兒孫更須參叩千歲巖前老用韻寄道純西堂濟北宗風江西法道電激雷奔不覆藏龍睛鶻眼難探討鞭起石麒麟毒蛇驚出草咬破鐵餕餡萬象齊稱好泥金剛直得汗流雪師子爭教推倒靈機洞徹威音前天香桂子秋光老如山號恩監寺求道人號如山山即如如體上屹萬象前下根九淵底巨靈力大無所施愚公歲久那能移號風老樹化鮫鰐霾雲怪石蹲熊羆恩大或云山可比道大未許形言語三脚驢子弄蹄行狼藉氷霜滿寰宇法華圖為鹿苑天鼓聞法師題現瑞舒光靈鷲峯宣揚妙法啟羣蒙三周七喻何親切百界千如本互融更雨天花香藹藹彌羅帝網影重重還它鹿苑扶宗手凡聖咸歸海印中寓幻室真不留兮妄本虗室名寓幻竟何如乾城影裡飛金鳳石火光中見梵廬以有相空為戶牖從無住法立屏除休聞吾語生疑訝三界均同一夢居遊景星巨靈何年施斧鑿巖崖𡾼峻千青旻銀河橫界可隣壁翠巘周羅猶從賓五更先見海底日三月未覺人間春潛光毓勝古淵藪璣公貫公僧鳳麟答方巖大林和尚二慢幢疑網已氷銷佛國魔宮幾許遙玉筯好撑師子口麻絛偏繫呂公腰尺圓寶鏡容千里六結花巾止一條用捨總行安樂法側微誰謂異層霄覺性圓明事若何凡兮非少聖非多一金豈礙持投井三獸奚勞喻渡河寶劒空中還自擲鈆刀石上任渠磨永嘉早已欠緘默今古猶傳證道歌答南堂和尚見寄韻二萬古穹祟少室峯是誰能復九年風不空佛病并祖病那得宗通與說通文豹惟知藏霧雨彩鸞終不受樊籠好將袖裡吹毛劒截斷千差到大同鈯斧拋來湖上峰閒居力振古宗風非惟睡虎全威在別有靈犀一點通夜坐沈檀浮寶鼎卯齋菱藕滿筠籠祥麟掣斷黃金鎖天外出頭誰與同答會翁和尚久客同登巾子峰滿軒江月桂華風年光易逐星霜換祖意難將語默通縛虎直須探虎穴養鷄何必閉雞籠萬機休罷頭如雪琴到無絃調自同巖頭雪嶠宿鼇峯抖擻肝膓不露風抹過三玄并五位掃空密證與潛通驊騮豈待金鞭影鸑鷟寧堪鐵網籠太祖西丘多胤胄家風不約自然同次夢堂和尚韻贈國清敞侍者再參侍者參得禪了也洞徹威音大劫前鐵馬奔程揮折箠冰河連底打焦甎明知心外元無佛剛道壺中別有天百丈當年再參話虗空為口舉難全次石屋和尚雜言韻五浮生多是強名模放下情緣道可圖雲影谿光清入座蕨牙菰米旋供厨穠花勿謂春難老童齓當知𩯭易枯萬物古今紛變化難逃天地一洪爐老我年來事事休為它猶自動閒憂林泉勝絕好遊翫烏兔奔忙難駐留作佛何須生竺國成仙多是慕蓬丘有為須極無為地幾箇工夫得到頭空階行蟻上生臺紅日三竿門始開抖擻裙衫無法說提𢹂瓶錫有僧來雨餘觀瀑非常好月下聞猿分外哀鶴脛自長鳧脛短是誰續也是誰裁慕道專誠要決疑當如勝負局中棊圓成般若空情識根本無明立見知自合探珠投赤水幾多拾礫向春池秋雲滿目頻搔首覺苑荒涼正此時萬化趨功不少停慵將大藥制頺齡纔逢露冷江楓赤又見春回野燒青供佛自持生鐵汲泉誰用古銅瓶天風一陣松濤惡高枕南午睡醒贈俊上人生佛已前奇特事須知用不出今時蒲帆遠別吳城畔鐵錫東遊越海涯進步孤來三事衲回頭惜取兩莖眉紅爐新出黃金彈驚落天邊白鳳兒答宗聖首座弟兄南北總成翁何日開懷話此宗本有靈源常湛湛顯玄法喻自重重見須見月休觀指聞貴聞心謾擊鐘若約衲僧門下令烏藤三十未輕容答天童元明和尚力闡宗猷九隴前當陽無黨亦無偏輝騰自己光明藏燭破佗家默照禪聖解競推憐末學靈機獨脫慕先賢煙霞老我千峰頂喜見雙溪有正傳寄則中度首座宗綱委地起無因敲唱深期過量人果卓掇時機自別茶瓢跳處話重新群生在在投迷網諸聖塵塵乘願輪拈起毫端風雨快優曇花綻不干春贈莊上人趙州十八見南泉心印無傳是正傳木馬驚嘶新脫鞅鐵牛酣臥久忘鞭雙眸掣電覰不破滿口含霜道得全萬古碧潭空界月何妨𣤩碎水中天答玄一隱君韻二彤霞暖影煦人酣水遶平坡竹遶庵道極玄微元不二教隨名相自分三雪花浮椀雨前茗金顆堆盤霜后柑童子無端事遊歷滿身煙水百城南如棊世事屢更新脫屣功名貴葆真蓬島跨來千歲鶴桃源別是一家春玄琴黃卷為佳侶老石長松作近隣珍重盤溪玄一子竿頭百尺解翻身答夢堂和尚見寄韻時重修僧傳簡修僧史甘露滅刪集傳燈楊大年重喜酉菴攎妙解廣揚列祖顯真傳陰凉大地閻浮樹饒益群生忍辱僊四海叢林遍蓁莽高堂何忍事安眠悼南堂法兄和尚說法洞庭湖外寺重來智積讖嘉期雲趨水赴三千里玉應金舂十二時沙竭龍歸無底毗嵐風撼不萌枝東西失此人天眼情與無情總皺眉癸卯八月廿五日南堂靠倒涅槃臺浮幢王剎毫端現優羅花火裡開妙解玄言都掃蕩真規素範頓追回嘉禾鄞水七百里側耳時聞震法雷次中竺用章和尚韻贈咨侍者我宗無語亦無法寧許胡抄與亂抄回首群魔皆近侍擡眸千聖匪同交噇空鐵休安柄載月金船好把梢吹起布毛方悟去分明屎塊向人拋次韻贈日本敬藏主參玄東走復西奔求劒刻舟徒記痕眼正龍蛇元易辯氣高佛祖可平吞掃空藏教五千軸抹過塵勞八萬門獨上城樓望鄉國海天寒日湧金盆謝事雙檜答天元師姪韻閒居四壁甘吾分鳴鼓無由逼晚參一任角聲來枕上慵將草色問城南鐵牛電眼難留屑石女雲鬟易受簪因憶慈明見神鼎江河為舌向誰談題大禪安西堂繼休居歸源二老人及南堂之後重拈雪竇所拈古德公案一百則百章古德閒公案五色摩尼耀大千多訝雲林藏玉櫝賸觀雪竇擊金鞭鳳臺光吐星中月崑阜香浮火裡蓮珍重南堂施敏手今逢法喜繼前賢寄夢堂和尚時在大慈閒居湖寺談禪病還如積翠在江西霜藤靠壁蛻龍骨磨衲擁肩行螘蹊句裡藏鋒全殺活機先失照隔雲泥空王浩劫至今日大化無私物物齊用韻贈靈隱密藏主未舉烏藤知落處不虗依我古巖西罕逢赤手抉驪頷多向枯樁尋兔蹊水可結冰冰即水泥能成像像非泥毗盧藏海空諸有一念不生凡聖齊用韻示左右二大家相聚喫莖虀莫話趙州東院西黃檗樹頭無蜜果懸崖險處有平蹊袒肩未荷千斤檐著脚先防三尺泥廓徹摩醯頂門眼劣形殊相本來齊此心無悟亦無迷多是東行却向西如信大虗堪覓縫從教古路自分蹊疾雷破嶽似摧朽利劒刜鐘如切泥老我煙霞成底用天時人事固難齊答天王東岡昕長老雲壓千峰路欲迷雪欹老栢斷橋西榮枯自信無纖念明昧誰云有二蹊守默癡禪油入麵尋文狂慧絮沾泥暮翁善唱無生曲喜見諸孫和得齊贈日本謙藏主祖域高深到未曾多誇密授與親承人心本自無今古法運其如有廢興罷向千門持鐵空圍萬象舉霜藤何期斫額搏桑曉枯木花開六月氷示暐藏主省師人人本有光明藏無受無傳古到今易領解時休領解難推尋處好推尋曹溪祖派稱南嶽積翠孫枝讓寂音得度有師歸禮覲尚期看我老雲林送大基丕長老住補陀浮幢王剎香海界古佛圓通門大開翠嶽峨峨參碧漢鯨濤湱湱震晴雷溈山踢倒淨瓶去黃檗取將禪版來一句迥超千聖外叢林氣象追回送定上人參方探玄須具眼列祖備機深但莫隨佗語終能見自心磨甎難作鏡點鐵易成金太古無絃曲相期發至音次韻留道中藏主至道關懷重浮生繫念輕行藏無別法語默總真情翳盡空元淨塵銷鏡自明風光清溢目何處問歸程送來上人參方子來需贈語展紙復沈吟蹇淺時流議寬洪古聖心無瑕稱美玉出鑛是精金道匪從人得專誠且訪尋次韻悼藻藏主有志探玄士牧牛師嬾安聖凡情若盡生死海能乾鸑鷟徒呈瑞芭蕉不耐寒百年真一夢萬事付三歎至正己亥謝事竹山歸圓明庵因閱真淨和尚語有一身終有限萬事畢無時之句析其十字為首成雜言十章示諸左右一庵鄰木井老我合投閒砌石成蓮沼開軒面藥闌亂峰青崒屼幽㵎瀉潺湲別有生涯在無絃琴好彈身居千嶂裡幾見歲華更壁靠過頭杖爐埋折脚鐺禦寒麆布褐誑腹老藜羮路轉溪回處是誰來共行終日倚巖隈閒雲去復來未明心即佛謾說鏡非臺濁水珠還現淤泥蓮可栽吾宗多異見有口亦慵開有身還有累無是無求隨事能通達何人不自由花生因翳眼岸住為停舟法道常超勝祗園自晚秋限時登聖果特地執愚情彈指三祇劫擡眸十萬程石牛畊曠野芻犬吠空城真正舉揚處堂前草盛生萬法何曾有一心元自無虗空終不壞滄海幾番枯妙辯毗城老單傳碧眼胡怪來木獬廌吞却石菸菟事理已圓融何妨話此宗採來都是藥捧上不成龍楊廣山前草金剛嶺上松大哉穹壤內千古慕靈蹤畢竟難傳授胡為喚作禪呈機非句裡領旨豈言前喝下分賓主棒頭明正偏祖翁田地在水牯好加鞭無事可思惟隨緣度歲時案頭間寶鴨壁角挂軍持雨歇谿聲壯月高松影遲真空并妙有一一洞靈知時光有今古佛性無悟迷表法名何別還源理自齊直教分水乳未免隔雲泥一舉四十九趙州東院西次所庵首座韻二隨處成嘉遁神珠耿夜光茅廬殊迫窄法界總含藏上國蒲輪召深爐芋火香癲癇循迷妄那可秘靈方覺皇如按指海印自生光火不鏡中出珠非衣裡藏甆甌浮雪乳石室藹天香妙達真空理規圓矩自方閱古軒歷探先聖意毫髮本無差未盡眼中翳那除空裡花凉風生几席白月照窻紗掩卷成枯坐真觀豈有涯答天童平石和尚見寄韻五不肯高居兜率天逢人要覓一文錢更言彌勒真彌勒摋土拋沙百眾前泐水禪如藥汞銀黃龍聞著即生嗔當時不是慈明老鐵網難收一角麟三尺竹篦長在握肯將佛法當人情巍然照雪軒中坐衲子教它眼自明旃檀樓閣翠嵐中水鏡襟懷鶴髮翁石鼎香銷定初起金烏拍翅海門東頭頭物物總天真誰謂今人媿古人慶喜何曾徇根識瞿曇徒自綰花巾贈的維那化米歸來仍化炭堂司一職輒相煩要明的的西來意只在尋常日用間贈西上人子到問吾西祖意老來有口只宜閒趙州曾指庭前栢千古叢林作話端贈靜知客動靜寒溫合自知江淮閩浙浪奔馳大陽寺裡顯知客乳竇峰頭百世師懷古十首寄大宗西堂鶉衣百結不掩骭糞火堆中有芋魁寒涕垂頤曾不管紫泥書自九天來語非難也識真難臨濟腰包上徑山汝自問它何欠少一堂雲侶半抽單頭上青灰三五斗趙州誰謂太疎慵等閑剔起眉毛看老虎斑斑是大蟲飢餐渴飲不多爭不向如來行處行怪底當年顛普化飯床踢倒大麁生白雲昔日見楊岐問及茶陵受業師不是當家真種草如何一笑會懷疑慈明參罷老汾陽短髮肩挑骨董箱神鼎老昏相見語叢林多是錯商量芭蕉庵中泉大道禪子來參無異談直示汾州奇特事解懷抖擻破裙衫古德示人閒露布看時容易會時難不因兩轉合頭語船子那能得夾山談辯對人無抵捂自家無事動干戈從前一等偷心死選佛場中得甲科三督黃牙竅到天衲僧蹉過萬千千字經三寫烏焉馬疊妙重玄競說禪次了菴和尚雜言韻八吾祖深慈豈易量要成大樹作陰涼看它五葉花開後萬紫千紅敢鬪芳胡僧得得飛金錫曾為汾陽罷夜參未許南堂樂閒寂要弘法道播東南一塵不立萬緣空夜半陽烏海底紅出窟金毛不求伴度河香象更誰同有生有死心源混無聖無凡性地平客至休嫌太疎嬾白雲流水自將迎赤手須探火裡氷自家活計勿它營德山白棒橫揮處即是昏衢智慧燈觸目遇緣無剩法何須要透未生前三冬喜有生柴火且自垂簾護煖煙揑沙終是不成團斷臂安心話已圓真正舉揚宗教事草深何止法堂前眼見耳聞無別旨手握烏藤行復倚菩薩聲聞曾未知各證圓通二十五信庵只箇無疑便入門其中別是一乾坤拳頭對客何勞竪日日茅檐挂白雲台州天寧音都管塑觀音知客寮起樓淨僧髮施草鞵觀音示現比丘身樓閣門開接要津剃了頭光飽喫飯草鞵重著見何人寄紫巖絕學和尚莫厭荒凉古道場吾宗只貴話頭行趙州曾住觀音院麥醋沙鹽土塌床示禪客問來汝須啞却口答去我須禿却舌堂前露柱笑掀眉達磨西來無妙訣析雪竇迷悟相反偈霏霏梅雨灑危層一句分明絕愛憎末法師僧少方便多將知解當宗乘五月山房冷似氷不教容易啟柴扄口邊白醭生來久且喜渾無問法僧莫謂乾坤乖大信古今毫髮不曾差趙州猶自婆心切凡見僧來喚喫茶未明心地是炎蒸縱已明來也只寧栽了冬瓜種茄子一條百衲補難成答靈隱竹泉和尚摩醯正眼耀乾坤物日禪翁六世孫倒握竹篦全殺活當陽擊碎鐵崑崙建三塔潭北湘南草正青敲甎打瓦見功成一非三也三非一那箇髑髏無眼睛華頂光菩薩製紙龕於爐上禦寒坐禪溪藤裁製禦寒威六面虗明定起時棗栢當年惟造論火爐頭話幾曾知山居深深爐內煨黃獨爛爛鍋中煑蕨薇曠劫不殊今日事今年不似去年飢綠蘿溪畔啟荊扉自浣襤衫布衲衣乾鵲鳴來又鳴去多年江海故人歸尋玄覓妙正紛然誰解回光究本源大地眾生銷妄見百千諸佛本無言法社凋衰心欲寒諸緣空寂更何言山窻睡起日卓午一樹桫欏花正繁平面似床松下石偃枝成蓋石邊松無心道者眉如雪煑得茶香分外濃雲銷陰崖寒意早枯枝收拾兩三堆不教菜葉隨流去恐悞高人訪道來定起蘿龕偶獨行不知人世歲華更閒拋藤子清池裡無限魚兒水面爭三箇柴頭煨正煖三竿寒日尚高眠明知有口可挂壁萬象森羅替說禪總是娘生一箇身任它富貴任它貧石床坐落三更月風揭松濤滿耳根山高纔寒便積雪三冬少有無雪時庭前齊腰憶二祖床上縮項思楊岐題祖會圖聖賢瑞世示冥權妙筆如何𦘕得全賴有陳年斷貫索將它鼻孔一時穿獨庵單單結構箇茅廬玉殿珠樓總不如非特與人難共住更無人可作鄰居勉中姪侍者參方千聖頂𩕳一著子決擇莫辭途路長雪嶠三回到投子慈明易服見汾陽贈僧書楞嚴法華圓覺華嚴四經直取華巾成六結曲垂根器演三乘其如深入光明藏破一微塵出大經贈峴維那為法花會化緣捺海塘興化棒頭知落處東西南北任縱橫靈山一會儼然在滄海桑田幾變更悼愚仲和尚諸方宿德死殆盡死到慧因愚仲翁法道衰寒端可卜典刑誰復繼高風頓悟心宗空萬法尤專密行化人天輪珠手裡一百八綻作火中金色蓮無疑何須東卜與西卜自信從來不覆藏見得一番親切了著衣喫飯只如常悼壽昌別源法兄四平生慣用黑荳法松源五世的骨孫信脚蹈翻生死海當陽指出鐵崑崘有口不吞三世佛十方剎土任遨遊死來隨例成顛倒舍利勞人滿掬收心存聖解道還殊藥有神功病莫除劫火從教燒海底涅槃生死本如如川陸動踰千里遠弟兄十載不承顏遺音昨到紫籜寺骨石已葬丹霞山國清索天封竹作水筧雙㵎當陽輕借問天封直下便相酬同將百尺竿頭意萬仞懸崖接上流答清凉實庵法兄六首時在太白前板黃金世界清凉國演說無邊舌廣長太白峯前分半座端如靈樹待韶陽籜頂幽居百念灰前明月幾番來昨朝僧向臺山去接得羅浮一信回吾知捉象與捉兔一等須教用力全日用現行明歷歷從來無得亦無傳根器未湛禁惡辣明窻之下且安排一聲看狗狼忙走門外紫湖空立牌大小雲門奇特事曾無一法可當情問渠諸佛出身處便道東山水上行不羨超宗并逸格何勞廣學與多知空來佛國三千界使得人間十二時悼紫巖絕學和尚晚年歸老千峯頂警發來蒙念未休聞道秋來遷化了何人重舉過窓牛染藏主天童持淨苕帚放來拈鐵剗淨邊功業穢邊修廁籌撥出光明藏笑倒天童老隰州有甚卓卓與的的老禪不覺舌頭長掃空教典五千卷糞壤堆頭自舉揚示朗侍者野鴨分明飛過去馬師驀鼻拽教回徒將鐵杵敲氷骨花在不萌枝上開行者福嚴歸葬父母父母非親孰最親報恩須是負恩人活埋黃土深三尺碓觜花開劫外春悼前清凉松隱和尚二八十五年能事畢跏趺合掌示真歸闍維重使人驚訝繚亂天華雪片飛直下西丘四世孫倒騎鐵馬上崑崙清凉山裡萬菩薩無相光中添一尊輗侍者歸省松岡和尚剎海三千彰妙用塵勞八萬洞靈知鳥窠吹起布毛處普化打翻筋斗時送希聖彥長老住溫州仙巖此去仙姑巖畔寺烏藤橫按接禪流安公破讀楞嚴句直得須彌笑點頭宗綱少室峰前拋鐵網振振盡是玉麒麟一從五派分來后赤手提持有幾人次松巖恕中和尚山居雜言四菩薩圓修與佛鄰退身三界拯孤貧茫茫角力趨程者頂燒鐘一萬斤雲頭按下守空知坐對飯籮甘受飢桂櫂蘭舟誇好手未聞奪得錦標歸一句了然超百億更疑何事待丁寧怪來昔日矮師叔蒲伏洞山床下聽江海歸來齒髮疎一庵移入深雲住獼猴成隊摘酸梨見人走上懸崖樹拜和天目老祖四題真蹟韻香山湯禪師濯足亭上牢添器費工程巧處偏於拙處呈濯足溪流顯靈異當時那辯濁中清石橋五百羅漢五百聲聞受記來神通手面走風雷石橋蹈斷不蹈斷且向深雲靜打隈瑞巖惺惺石恠石破陀讓蘚苔老禪危坐不傾摧長年報道惺惺著那箇出它機境來龍湫詎那尊者詎那抱膝古崖阿萬斛觀傾設利羅我欲為渠施痛掌奈渠不肯轉頭何題列祖傳法正宗標目金舂玉應楔出楔燄續芳聯心印心真淨界中無位次閻浮世上有知音答傳首座二汾陽有語莫妄想長慶連云也太差踢倒飯床顛普化築來脚指老玄沙竭世樞機固可𠷣窮諸玄辯亦徒為碓坊盧老不識字六代傳衣還是伊招國清東席木庵和尚皮膚脫盡唯真實一片虗懷水鏡開正好清狂伴寒拾隰州古佛望歸來聞䳌有感寄國清東席了空和尚倒指從頭數故人音書處處隔風塵杜䳌啼上三更月一箇空山老病身招前明慶瑩中法弟音容動別半千里黃落已驚三十秋細大法門無可說欽山有語啟巖頭析舊作成四章示淡維那化米歸來仍化炭殺人劒也活人刀誰知恩大難酬處海未為深山未高堂司一職輒相煩徹骨氷寒者一番束破桶盆雙眼碧黑花猫子面門斑要明的的西來意塞却咽喉須出氣無言童子念摩訶釋迦不受然燈記只在尋常日用間須知覿面隔千山句中有眼終難會琴上無絃正好彈送僧持覺皇三界獨稱尊法化宣流在子孫喜覩雲堂容海眾高擎鐵盋向檀門聵翁娘生兩耳聾來好老去無聞萬念如每見傍人開笑口仰天閒撚白髭鬚謝事太白偶閱東石和尚語其間有賀能仁仲南東堂退居偈析成四章示諸左右占得溪房最上層省來赤脚蹈氷稜縱饒著我千金價不賣平生百不能山中拋却一堂僧總可它年繼祖燈萬象森羅熾然說何須勞我舉烏藤小園移在闌干下屋角天風鳴鐵馬今無良遂來咨參麻谷鋤頭對誰把自摘青藜雜飯蒸飽餐毛孔有餘馨笑它昔日毗耶老演出如來最上乘贈日者壽夭榮枯底用推定於哇地一聲時先生妙縱談天舌本命元辰合自知製衣沈氏求引線行針無別法量長較短在臨時工夫純熟自省力手段精奇人共知修鞋鮑氏求破柴床下埋塵久妙手重修在此時初祖親攜返西竺大陽轉付續宗枝季曇二千年后法末世優羅華遍界春飲光獨得正法眼謾盡靈山百萬人閒居雜言同韻六首瘦藤孤倚碧池頭照影空驚兩𩯭秋祖道流通滿寰海負舂盧老出新州有口何勞舉話頭萬松聲撼四時秋夜明廉外排班立恠底當年老隰州敲出麒麟拄杖頭機如激電氣橫秋唆佗臨濟參黃檗徹底婆心是睦州翻身只在一毫頭凜若神山碧海秋打失眼睛孚上座角聲吹徹古楊州牧牛善解掣繩頭祖父田園會有秋不見溈山傳寂子宗乘大闡在袁州一室空山白盡頭祇園無處不凋秋束腰豈易追藥嶠行脚尤難學趙州悼玄一隱君埋玉平原草樹荒隱君玄一未甞亡清凉傳與補陀傳千古名山有耿光圖書四壁貫晴虹方外猶明少室宗那料藏舟移夜壑丹霞無處訪龐翁圓中轉轆轆地如盤走珠向外尋覓天地懸殊一言只箇歸源旨分明不二談機先見真諦何用口喃喃生上人禮補陀大士巖間出見勞生日用相逢楊柳枝枝甘露旃檀葉葉香風凝碧亭群峯鎖煙靄方池漾漣遙空結靜色一片清琉璃溪謳十首贈無著山主小小一溪水雄雄四面山道人栖止處茅屋兩三間壁角破沙鍋洗來猶可用撥雪挑薺牙夜深營茗供溪居樂性情誰云大孤絕脫脚濯清流開窗待明月四畔多山家朴古忘彼我共樂鐘磬聲隨時送山果洗衣一片石闊可四五尺崖根著脚牢溪湍任舂激鹽從山市賒麥寄隣家磨斫得生柴歸日頭檐外過茗盌對爐香同參引話長西風上衡岳夜雨宿瀟湘溪雲弄晚晴飛起碧蜻蜓西園看梨棗何處唱歌聲寒日已卓午柴扉猶未開飢烏如有約成隊下生臺夜來寒氣濃天明雪沒屋化粮人未歸充飢有黃獨小佛事為曉上座火提起火汝是超生越死曉事底人隔墻見角便知是牛隔山見煙便知是火擲下火仁藏主火生也不道死也不道一大藏教詮註不及仁則榮不仁則辱般若如大火聚近之則燎却面門勤都管火上士聞道勤而行之生死到來總用不著動絃別曲葉落知秋摺折聖箭子撥火覓浮漚寂都管火逼慈明晚參對白雲發笑照而常寂寂而常照擲下火火蛇鑽汝髑髏退後退後能都寺火能所俱亡生死路絕楊岐金剛圈栗棘蓬拈向一邊金將石試玉將火試仁都寺火楊岐輔慈明石窻輔宏智仁者必有勇勇者不必有仁顧眾云夜來何處火燒出古人墳昌都寺火透得金剛圈吞得栗棘蓬大昌吾道死款活供擲下火南山燒炭北山紅規都管火打破生死關摺折聖箭子未為好手要見真規復復真須火裏蓮開琦典座火如麟如鳳如琦如瑰敵不得死生何益明日喫甚菜二年同一春擲下火紅爐焰裏好翻身堯首座火不譽堯而非桀不喜佛而增魔不捨妄而求真不貪生而畏死摩訶衍法離四句絕百非撥波求得火燒却五須彌宗首座火我宗無語句亦無一法與人仰山夢昇天宮第二座說摩訶衍法有甚交涉擲下火喚作火則燒殺你不喚作火則凍殺你禪上座火道無古今禪非坐臥死款活供能有幾箇太原孚上座在楊州聞角聲髑髏前打失眼睛也是認橘皮作火
